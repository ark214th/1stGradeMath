<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffc9e6">
<title>ゆめかわ かずうさガーデン</title>
<style>
:root{--ink:#7a3563;--pink:#ff7fbf;--deep:#d94b93;--lav:#b9a2ff;--cream:#fff8fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Yu Gothic",sans-serif;color:var(--ink);touch-action:manipulation;background:#ffd9ec}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 90% 45%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(ellipse at 20% 0%,#ffd0ec 0%,transparent 55%),
  radial-gradient(ellipse at 100% 10%,#e3d2ff 0%,transparent 50%),
  linear-gradient(180deg,#ffc9e6 0%,#f1d3ff 38%,#d6ecff 72%,#d4fbef 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.nlabel{position:absolute;left:0;top:0;will-change:transform;font-weight:900;color:var(--ink);background:#fff;border:5px solid var(--c);border-radius:999px;min-width:1.55em;height:1.55em;padding:0 .2em;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;box-shadow:0 5px 0 rgba(160,60,120,.12),0 8px 18px rgba(160,60,120,.18);transition:opacity .25s}
.nlabel.s{font-size:21px;border-width:3px;box-shadow:0 3px 0 rgba(160,60,120,.12)}
.nlabel.rainbow{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff8fa3,#ffb36b,#ffe066,#9ee493,#7fd0f5,#a39bff,#e79bff) border-box}
.nlabel.pearl{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#ffb8dc,#d4c2ff,#b5eaff,#ffe9b0,#ffb8dc) border-box}
.nlabel.pop{animation:lpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes lpop{0%{scale:.3}100%{scale:1}}
.anchor{position:absolute;left:0;top:0;will-change:transform}
.bubble{background:#fff;border-radius:26px;padding:10px 20px;font-size:34px;font-weight:900;white-space:nowrap;box-shadow:0 6px 0 rgba(160,60,120,.12),0 10px 22px rgba(160,60,120,.2);animation:lpop .5s cubic-bezier(.3,1.6,.5,1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.hand{font-size:64px;animation:handb .8s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(120,40,90,.25))}
@keyframes handb{0%,100%{translate:0 0}50%{translate:0 14px}}

#ui{position:fixed;inset:0;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none;display:none}
.layer.on{display:block}
.pe{pointer-events:auto}
.btn{border:0;border-radius:999px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffa6d4,#ff6fb3);box-shadow:0 6px 0 var(--deep),0 12px 24px rgba(200,60,130,.28);padding:14px 30px;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(180,40,110,.3);position:relative;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.btn.lav{background:linear-gradient(180deg,#cbb8ff,#9d82f5);box-shadow:0 6px 0 #7258d6,0 12px 24px rgba(110,80,200,.25)}
.btn.lav:active{box-shadow:0 2px 0 #7258d6}
.btn.mint{background:linear-gradient(180deg,#9ff0d4,#4fd1a8);box-shadow:0 6px 0 #2ea883,0 12px 24px rgba(40,160,120,.25);text-shadow:0 2px 0 rgba(20,120,90,.3)}
.btn.mint:active{box-shadow:0 2px 0 #2ea883}
.btn.white{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 6px 0 #f0bcd8,0 12px 24px rgba(200,60,130,.18)}
.btn.white:active{box-shadow:0 2px 0 #f0bcd8}
.pill{background:rgba(255,255,255,.88);border-radius:999px;padding:8px 18px;font-weight:900;box-shadow:0 4px 0 rgba(200,90,150,.15)}
.ibtn{border:0;background:rgba(255,255,255,.92);border-radius:24px;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;box-shadow:0 5px 0 #f0bcd8,0 10px 20px rgba(200,60,130,.15);position:relative}
.ibtn small{font-size:13px;font-weight:900;margin-top:2px}
.ibtn:active{transform:translateY(3px);box-shadow:0 2px 0 #f0bcd8}
.dot{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#ff5a9e;border:3px solid #fff;animation:beat 1s infinite}
@keyframes beat{50%{scale:1.2}}

/* splash */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(40px,env(safe-area-inset-top)) 16px max(46px,env(safe-area-inset-bottom))}
.title{text-align:center}
.title h1{margin:0;font-size:clamp(40px,7vw,76px);line-height:1.15;color:#fff;letter-spacing:.04em;text-shadow:0 4px 0 #ff82bf,0 8px 0 #c77dff,0 14px 24px rgba(160,60,140,.3);-webkit-text-stroke:2px #ff9fd0}
.title p{margin:10px 0 0;font-weight:900;font-size:22px;color:#a04a86}
#startBtn{font-size:34px;padding:20px 54px;animation:breath 1.6s ease-in-out infinite}
@keyframes breath{50%{scale:1.06}}
#loadMsg{font-weight:900;font-size:20px;background:#fff;padding:10px 20px;border-radius:20px;margin-top:12px;display:none}

/* garden */
#gTop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));gap:10px}
.logo{font-size:24px;font-weight:900;color:#c24d8f;background:rgba(255,255,255,.9);padding:10px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(200,90,150,.15)}
#friends{display:flex;gap:5px;margin-top:10px;background:rgba(255,255,255,.75);padding:7px 10px;border-radius:999px;width:max-content}
#friends span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:#eee;color:#bbb;border:3px solid #fff}
#friends span.m{background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.gbtns{display:flex;gap:12px}
#gBottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding-bottom:max(26px,env(safe-area-inset-bottom))}
#playBtn{font-size:36px;padding:20px 58px;animation:breath 1.8s ease-in-out infinite}
#giftTag{margin-bottom:14px;font-size:20px;animation:beat 1.4s infinite}
#doneTag{margin-bottom:14px;font-size:18px}

/* play */
#pTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 16px 0}
#homeBtn{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:64px;height:64px;font-size:30px}
#prog{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(22px,calc(env(safe-area-inset-top) + 10px));font-size:28px;letter-spacing:2px;background:rgba(255,255,255,.8);padding:4px 12px;border-radius:999px}
#prog .cur{display:inline-block;animation:beat 1s infinite}
#eq{background:rgba(255,255,255,.94);border-radius:999px;padding:4px 34px;font-size:64px;font-weight:900;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 rgba(200,90,150,.15),0 12px 26px rgba(200,90,150,.18);min-height:96px}
#eq .op{color:#e57fb6;font-size:52px}
#eq .q{display:inline-grid;place-items:center;width:78px;height:78px;border-radius:22px;background:#ffeef7;border:4px dashed #ff9fcf;color:#ff7ab8;animation:beat 1.2s infinite}
#eq .ans{animation:lpop .6s cubic-bezier(.3,1.6,.5,1)}
#pBottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 12px max(18px,env(safe-area-inset-bottom));gap:12px}
#instr{font-size:26px;font-weight:900;background:#fff;border-radius:26px;padding:10px 24px;box-shadow:0 5px 0 rgba(200,90,150,.14);min-height:54px;display:flex;align-items:center;gap:8px;transition:opacity .2s}
#instr:empty{opacity:0}
#choices{display:flex;gap:22px;min-height:170px;align-items:flex-end}
.choice{border:0;width:170px;height:170px;border-radius:36px;background:#fff;box-shadow:0 8px 0 var(--c),0 14px 26px rgba(160,60,120,.18);display:flex;align-items:center;justify-content:center;gap:10px;position:relative;animation:lpop .45s cubic-bezier(.3,1.6,.5,1) backwards;border:5px solid var(--c)}
.choice:active{transform:translateY(5px);box-shadow:0 3px 0 var(--c)}
.choice .cn{font-size:84px;font-weight:900;color:var(--ink);line-height:1}
.choice.pic .cn{font-size:62px}
.choice.wrong{opacity:.35;filter:grayscale(.6);animation:shake .45s}
.choice.right{animation:lpop .5s;box-shadow:0 0 0 8px #fff,0 0 0 14px var(--c)}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}
.mb{display:flex;gap:3px;align-items:flex-end}
.mb .col{display:flex;flex-direction:column-reverse;gap:3px}
.mb i{width:17px;height:17px;border-radius:5px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
#hintBtn{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(200px,calc(env(safe-area-inset-bottom) + 190px));font-size:22px;padding:12px 20px;display:none}

/* dress */
#dTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 16px 0}
#dBack{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:64px;height:64px;font-size:30px}
#dPanel{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(920px,calc(100% - 24px));background:rgba(255,255,255,.93);border-radius:34px;padding:14px 16px;box-shadow:0 10px 30px rgba(160,60,120,.2)}
#dTabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
#dTabs button{width:54px;height:54px;border-radius:50%;border:4px solid #fff;background:var(--c);color:#fff;font-size:24px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.3);box-shadow:0 3px 0 rgba(0,0,0,.1)}
#dTabs button.sel{outline:5px solid #ff6fb3;transform:scale(1.1)}
#dItems{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#dItems button{border:0;background:#fff4fa;border-radius:22px;width:92px;height:92px;font-size:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #f5c9e0}
#dItems button small{font-size:11px;font-weight:900;margin-top:2px;line-height:1.1;text-align:center}
#dItems button.sel{background:#ffd7eb;outline:4px solid #ff8fc6}
.empty{font-weight:900;padding:18px;text-align:center;font-size:20px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(120,50,100,.28);display:none;align-items:center;justify-content:center;padding:16px;pointer-events:auto;z-index:10}
#modal.on{display:flex}
.card{background:var(--cream);border-radius:40px;padding:26px 28px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(120,40,90,.3);border:6px solid #fff;text-align:center;animation:lpop .45s cubic-bezier(.3,1.5,.5,1);-webkit-user-select:none}
.card h2{margin:0 0 12px;font-size:34px;color:#c24d8f}
.card p{font-size:22px;font-weight:800;margin:8px 0}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stk{border:0;width:150px;height:150px;border-radius:36px;background:#fff;font-size:88px;box-shadow:0 7px 0 #f3c3dc,0 12px 24px rgba(200,60,130,.18);animation:lpop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stk:active{transform:translateY(4px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal div{aspect-ratio:1;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#c9a0b8;position:relative}
.cal div b{font-size:clamp(22px,4.4vw,40px);line-height:1}
.cal div.h{background:transparent;color:var(--ink);font-size:16px;aspect-ratio:auto;padding:4px}
.cal div.t{outline:4px solid #ff8fc6}
.cal div.x{background:transparent}
.cal b.land{animation:stamp .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{scale:4;opacity:0;rotate:-30deg}100%{scale:1;opacity:1;rotate:0deg}}
.calnav{display:flex;justify-content:space-between;align-items:center}
.calnav button{border:0;background:#fff;border-radius:50%;width:52px;height:52px;font-size:24px;box-shadow:0 3px 0 #f3c3dc}
.big{font-size:90px;line-height:1.1;margin:6px 0}
/* parent */
.ptab{border-collapse:separate;border-spacing:4px;margin:10px auto}
.ptab td,.ptab th{width:44px;height:40px;border-radius:10px;font-size:13px;font-weight:900}
.ptab th{color:#a36b8e}
.ptab td{background:#fff}
.ptab td.b0{background:#ffe3ee}.ptab td.b1{background:#ffc7de}.ptab td.b2{background:#e3cbff}.ptab td.b3{background:#bfe6ff}.ptab td.b4{background:#b5f0cd}
.ptab td.na{background:transparent}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:800}
.legend span{padding:4px 10px;border-radius:10px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:18px;padding:10px 16px;margin:8px 0;font-weight:900;font-size:18px;text-align:left}
.seg{display:flex;gap:6px}
.seg button{border:0;border-radius:12px;padding:8px 12px;background:#ffeaf4;font-weight:900;font-size:16px}
.seg button.sel{background:#ff8fc6;color:#fff}
.small{font-size:15px!important;font-weight:700!important;color:#8d5a7a}
#parentBtn .ring{position:absolute;inset:-4px;border-radius:28px;border:5px solid #ff8fc6;clip-path:inset(0 100% 0 0);pointer-events:none}
#parentBtn.hold .ring{transition:clip-path 1.2s linear;clip-path:inset(0 0 0 0)}
#skipBtn{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font-size:18px;padding:10px 18px}
#bigMsg{position:absolute;left:0;right:0;top:max(24px,env(safe-area-inset-top));display:flex;justify-content:center;padding:0 16px}
#bigMsg div{font-size:30px;font-weight:900;background:rgba(255,255,255,.94);border-radius:28px;padding:12px 28px;box-shadow:0 6px 0 rgba(200,90,150,.14);text-align:center;animation:lpop .5s cubic-bezier(.3,1.6,.5,1)}
#bigMsg:empty{display:none}
#bottomBtn{position:absolute;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));display:flex;justify-content:center}
@media (max-aspect-ratio:1/1){#prog{right:auto;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top)) + 112px);font-size:22px}}
@media (max-width:700px){
  #eq{font-size:44px;padding:4px 20px;min-height:72px}#eq .q{width:56px;height:56px}
  .choice{width:108px;height:120px;border-radius:28px}.choice .cn{font-size:58px}.choice.pic .cn{font-size:40px}.mb i{width:11px;height:11px;border-radius:3px}
  #choices{gap:12px;min-height:124px}#instr{font-size:19px}
  .logo{font-size:18px}.ibtn{width:62px;height:62px;font-size:26px}#friends span{width:22px;height:22px;font-size:11px}
  #playBtn{font-size:28px}.stk{width:100px;height:100px;font-size:58px}
  #hintBtn{bottom:170px}
}
</style>

</script>

<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui">
  <div class="layer on" id="L-splash"><div id="splash" style="height:100%">
    <div class="title"><h1>ゆめかわ<br>かずうさガーデン</h1><p>かずの うさぎたちと なかよくなろう</p></div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <button class="btn pe" id="startBtn">▶ はじめる</button>
      <div id="loadMsg">よみこみちゅう…</div>
    </div>
  </div></div>

  <div class="layer" id="L-garden">
    <div id="gTop">
      <div><div class="logo">🌸 かずうさガーデン</div><div id="friends"></div></div>
      <div class="gbtns pe">
        <button class="ibtn" id="calBtn">📒<small>シール</small></button>
        <button class="ibtn" id="dressBtn">🎀<small>きせかえ</small></button>
        <button class="ibtn" id="parentBtn">⚙️<small>おうち</small><span class="ring"></span></button>
      </div>
    </div>
    <div id="gBottom">
      <div class="pill" id="giftTag">🎁 きょうの プレゼントが まってるよ！</div>
      <div class="pill" id="doneTag">✨ きょうの シール もらったね！ また あそべるよ</div>
      <button class="btn pe" id="playBtn">🐰 あそぶ！</button>
    </div>
  </div>

  <div class="layer" id="L-play">
    <div id="pTop"><div id="eq"></div></div>
    <button class="ibtn pe" id="homeBtn">🏠</button>
    <div id="prog"></div>
    <button class="btn lav pe" id="hintBtn">💡 かぞえる</button>
    <div id="pBottom"><div id="instr"></div><div id="choices" class="pe"></div></div>
  </div>

  <div class="layer" id="L-show">
    <div id="bigMsg"></div>
    <button class="btn white pe" id="skipBtn" style="display:none">スキップ ▶</button>
    <div id="bottomBtn" class="pe"></div>
  </div>

  <div class="layer" id="L-dress">
    <div id="dTop"><div class="logo">🎀 きせかえ</div></div>
    <button class="ibtn pe" id="dBack">🏡</button>
    <div id="dPanel" class="pe"><div id="dTabs"></div><div id="dItems"></div></div>
  </div>
</div>
<div id="modal"></div>

<script>
  // three.js の読み込みに失敗したとき用
  setTimeout(function(){ if(!window.__kzReady){ var m=document.getElementById('loadMsg'); m.style.display='block'; m.textContent='インターネットに つないで もういちど ひらいてね'; } }, 9000);
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= 基本ユーティリティ ================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);

const ease = {
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  lin: t => t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const tweens = new Set();
function tween(dur, fn, e = ease.io) {
  return new Promise(res => { if (dur <= 0) { fn(1); res(); return; } tweens.add({ t: 0, dur, fn, e, res }); });
}
const wait = s => tween(s, () => {});
function updateTweens(dt) {
  for (const tw of [...tweens]) {
    tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.e(k));
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
}

/* 流れ（シーン）の中断管理 */
let FLOW = 0; const ABORT = Symbol('abort');

const AC = {
  ctx: null,
  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    this.ctx = new C();
    this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = .55; this.sfx.connect(this.out);
    this.bgm = this.ctx.createGain(); this.bgm.gain.value = 0; this.bgm.connect(this.out);
    this.startBgm();
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  note(f, t0, dur, { type = 'sine', vol = .3, g = this.sfx, slide = 0, attack = .006 } = {}) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), a = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + dur);
    a.gain.setValueAtTime(.0001, t0); a.gain.exponentialRampToValueAtTime(vol, t0 + attack); a.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(a); a.connect(g); o.start(t0); o.stop(t0 + dur + .05);
  },
  pop(p = 1) { const t = this.now(); this.note(380 * p, t, .16, { vol: .35, slide: 2.2 }); },
  tap() { const t = this.now(); this.note(880, t, .1, { type: 'triangle', vol: .18, slide: 1.4 }); },
  count(n) { const sc = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760]; const f = sc[(n - 1) % 10], t = this.now(); this.note(f, t, .4, { type: 'triangle', vol: .3 }); this.note(f * 2, t, .3, { vol: .07 }); },
  sparkle() { const t = this.now(); [1319, 1568, 1760, 2093, 2637, 3136].forEach((f, i) => this.note(f, t + i * .055, .35, { vol: .11 })); },
  fanfare() { const t = this.now(); [[523, 0], [659, .11], [784, .22], [1047, .33]].forEach(([f, d]) => { this.note(f, t + d, .5, { type: 'triangle', vol: .26 }); this.note(f / 2, t + d, .4, { vol: .1 }); }); this.note(1319, t + .45, .9, { vol: .13 }); this.note(1568, t + .45, .9, { vol: .1 }); },
  boing() { const t = this.now(); this.note(300, t, .4, { vol: .25, slide: .6 }); this.note(240, t + .12, .35, { type: 'triangle', vol: .12, slide: .7 }); },
  whoosh() { const t = this.now(); this.note(300, t, .35, { vol: .12, slide: 3 }); },
  shake() { const t = this.now(); [0, .07, .14].forEach(d => this.note(200 + Math.random() * 80, t + d, .08, { type: 'square', vol: .05 })); },
  magic() { const t = this.now(); for (let i = 0; i < 10; i++) this.note(700 + i * 140, t + i * .04, .25, { vol: .07 }); },
  startBgm() {
    // オルゴール風の やさしい ループ
    const N = { C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5, D6: 1174.66, E6: 1318.5 };
    const mel = ['E5', 'G5', 'A5', 'G5', 'E5', 'D5', 'C5', 'D5', 'E5', 'G5', 'C6', 'A5', 'G5', 0, 0, 0,
      'A5', 'C6', 'D6', 'C6', 'A5', 'G5', 'E5', 'G5', 'A5', 'G5', 'E5', 'D5', 'C5', 0, 0, 0];
    const bass = [130.81, 110, 174.61, 196];
    const step = 60 / 100 / 2; let next = this.ctx.currentTime + .2, i = 0;
    setInterval(() => {
      if (!this.ctx || this.ctx.state !== 'running') return;
      while (next < this.ctx.currentTime + .4) {
        const m = mel[i % 32];
        if (m) { this.note(N[m], next, .9, { vol: .16, g: this.bgm }); this.note(N[m] * 2, next, .5, { vol: .03, g: this.bgm }); }
        if (i % 8 === 0) { const b = bass[Math.floor(i / 8) % 4]; this.note(b * 2, next, 1.6, { type: 'triangle', vol: .09, g: this.bgm }); this.note(b * 3, next + step * 2, 1.0, { vol: .04, g: this.bgm }); }
        next += step; i++;
      }
    }, 120);
    this.applyBgm();
  },
  ducked: false,
  applyBgm() { if (!this.ctx) return; const v = S.settings.bgm ? (this.ducked ? .12 : .38) : 0; this.bgm.gain.setTargetAtTime(v, this.ctx.currentTime, .25); },
  duck(on) { this.ducked = on; this.applyBgm(); },
};

const Voice = {
  ok: 'speechSynthesis' in window, v: null,
  init() {
    if (!this.ok) return;
    const pv = () => {
      const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
      this.v = vs.find(v => /Kyoko|O-ren|Nanami|Haruka|Ayumi|Mizuki/i.test(v.name)) || vs.find(v => /Google/i.test(v.name)) || vs[0] || null;
    };
    pv(); speechSynthesis.onvoiceschanged = pv;
  },
  say(text, { pitch = 1.3, rate = 1, interrupt = false } = {}) {
    return new Promise(res => {
      if (!this.ok || !S.settings.voice) { setTimeout(res, 200 + text.length * 70); return; }
      if (interrupt) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; if (this.v) u.voice = this.v; u.pitch = pitch; u.rate = rate;
      let done = false; const fin = () => { if (done) return; done = true; AC.duck(false); res(); };
      u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 230);
      AC.duck(true); speechSynthesis.speak(u);
    });
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
};

const _v = new THREE.Vector3();
let W = innerWidth, H = innerHeight;

const anchors = new Set();

function unanchor(a) { if (!a) return; a.el.remove(); anchors.delete(a); }

const parts = [];
function burst(pos, { n = 14, emojis = ['✨', '💖', '⭐'], speed = 4, size = .55, life = 1.2, up = 2.5, gravity = -5 } = {}) {
  for (let i = 0; i < n; i++) {
    const sp = new THREE.Sprite(emojiMat(pick(emojis)).clone());
    sp.position.copy(pos); const s = size * rand(.7, 1.25); sp.scale.setScalar(s);
    const v = new THREE.Vector3(rand(-1, 1), rand(0, 1), rand(-.6, .6)).normalize().multiplyScalar(speed * rand(.5, 1)); v.y += up;
    scene.add(sp); parts.push({ sp, v, life: life * rand(.8, 1.2), age: 0, rot: rand(-3, 3), s });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age += dt; p.v.y += (p.gravity ?? -5) * dt;
    p.sp.position.addScaledVector(p.v, dt); p.sp.material.rotation += p.rot * dt;
    const k = p.age / p.life; p.sp.material.opacity = 1 - k * k;
    if (k >= 1) { scene.remove(p.sp); p.sp.material.dispose(); parts.splice(i, 1); }
  }
}

const bunnies = new Set();
class Bunny {
  constructor(n, { scale = 1, label = 'm' } = {}) {
    this.n = n; this.alive = true;
    this.root = new THREE.Group(); this.body = new THREE.Group(); this.root.add(this.body);
    this.root.scale.setScalar(scale);
    this.cubes = [];
    for (let i = 0; i < n; i++) this.addCube(i, cubeColor(n, i));
    this.earMat = toon(earColor(n));
    this.makeHead(); this.body.add(this.head);
    this.tail = new THREE.Mesh(GEO.tail, MAT.tail); this.tail.position.set(0, .45, -.52); this.body.add(this.tail);
    this.shadow = new THREE.Mesh(GEO.plane, MAT.shadow.clone()); this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = .02; this.root.add(this.shadow);
    this.t = rand(0, 10); this.blinkT = rand(1, 4); this.sq = 0; this.hopY = 0; this.busy = false; this.labelOn = !!label;
    this.label = label ? makeLabel(n, label) : null;
    this.layout(false); this.personality();
    this.setAcc(S.outfits[n]);
    bunnies.add(this);
  }
  addCube(i, color) {
    const m = new THREE.Mesh(GEO.cube, toon(color)); m.userData = { bunny: this, cube: true, glow: false };
    m.position.copy(slot(i)); this.cubes.push(m); this.body.add(m); return m;
  }
  makeHead() {
    const h = this.head = new THREE.Group(); h.userData.headOf = this;
    const f = new THREE.Group(); f.position.z = .475; h.add(f);
    this.eyes = []; this.happyEyes = [];
    for (const s of [-1, 1]) {
      const e = new THREE.Group(); e.position.set(s * .19, .06, 0);
      const ball = new THREE.Mesh(GEO.eye, MAT.eye); ball.scale.set(1, 1.18, .42); e.add(ball);
      const sh = new THREE.Mesh(GEO.shine, MAT.white); sh.position.set(.035, .05, .05); e.add(sh);
      const sh2 = new THREE.Mesh(GEO.shine2, MAT.white); sh2.position.set(-.035, -.045, .05); e.add(sh2);
      f.add(e); this.eyes.push(e);
      const hp = new THREE.Mesh(GEO.happy, MAT.eye); hp.position.set(s * .19, .02, .01); hp.visible = false; f.add(hp); this.happyEyes.push(hp);
      const ck = new THREE.Mesh(GEO.cheek, MAT.cheek); ck.position.set(s * .31, -.085, .006); ck.scale.y = .75; f.add(ck);
      const mo = new THREE.Mesh(GEO.mouth, MAT.mouth); mo.rotation.z = Math.PI; mo.position.set(s * .042, -.075, .012); f.add(mo);
    }

      const p = new THREE.Group(); p.position.set(s * .2, .42, -.04); p.userData.base = -s * .14;
      const e = new THREE.Mesh(GEO.ear, this.earMat); e.position.y = .36; e.scale.z = .55; p.add(e);
      const ei = new THREE.Mesh(GEO.earIn, this.n === 1 || this.n === 8 ? MAT.earInW : MAT.earIn); ei.position.set(0, .36, .06); ei.scale.z = .32; p.add(ei);
      h.add(p); this.ears.push(p);
    }
    this.acc = new THREE.Group(); h.add(this.acc);
  }
  personality() { // 耳のかたちで こせい
    const n = this.n, [l, r] = this.ears;
    l.userData.base = .14; r.userData.base = -.14; l.userData.bx = 0; r.userData.bx = 0;
    if (n % 3 === 2) r.userData.base = -.95;
    if (n % 4 === 3) { l.userData.base = .3; r.userData.base = -.3; }
    if (n === 10) { l.userData.bx = -.15; r.userData.bx = -.15; }
  }
  setAcc(id) {
    this.acc.clear(); this.accId = id || null; this.accTall = (id && ACC_TALL[id]) || 0;
    if (id && ACC[id]) this.acc.add(ACC[id]());
  }
  get width() { return this.n > 5 ? 2 : 1; }
  get tall() { return Math.min(this.n, 5); }
  layout(anim = true, dur = .45) {

    if (!anim) { this.head.position.copy(hp); this.body.position.x = bx; this.shadow.scale.set(sw, 1.5, 1); return Promise.resolve(); }

        else { this.label.style.opacity = 1; this.label.style.transform = `translate(${p[0]}px,${p[1]}px) translate(-50%,-100%)`; }
      }
    }
  }
  setHappy(on) { this.eyes.forEach(e => e.visible = !on); this.happyEyes.forEach(e => e.visible = on); }
  async hop({ to = null, h = .75, dur = .45, sq = .16 } = {}) {
    const r = this.root.position, from = r.clone();
    if (to) { const dx = to.x - from.x, dz = to.z - from.z; if (Math.hypot(dx, dz) > .05) this.turn(Math.atan2(dx, dz)); }
    await tween(.09, k => this.sq = sq * k, ease.out);

  }
  turn(a, dur = .22) { const r0 = this.root.rotation.y; let d = a - r0; d = Math.atan2(Math.sin(d), Math.cos(d)); return tween(dur, k => this.root.rotation.y = r0 + d * k); }

    AC.pop(.8); burst(this.root.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, .2, .5)), { n: 6, emojis: ['✨', '💫'], speed: 3, up: 1, size: .4 });

function pickQuestions(n) {

    for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }

  if (S.unlocked >= 10) return 0;
  const pool = allFacts(S.unlocked), good = pool.filter(([a, b]) => (S.facts[fkey(a, b)]?.box || 0) >= 2).length;
  if (good / pool.length >= .6) { S.unlocked++; save(); return S.unlocked; }
  return 0;
}

const instr = t => $('#instr').innerHTML = t || '';

function tapCube(bunny, cube) {
  const t = P.tap; if (!t) return;
  const i = bunny.cubes.indexOf(cube);
  if (bunny !== t.bunny) { AC.tap(); return; }
  if (i < 0 || t.done.has(i)) { AC.tap(); return; }
  t.done.add(i); const num = t.next++;
  bunny.showBadge(i, num); bunny.glow(i); bunny.popCube(i); AC.count(num); Voice.say(YOMI[num], { interrupt: true, rate: 1.1 });
  if (t.done.size >= bunny.n) { hideHand(); P.tap = null; setTimeout(t.res, 700); }
  else { const nx = bunny.cubes.findIndex((c, k) => !t.done.has(k)); showHand(bunny.cubes[nx]); }
}
const tapCount = (bunny, start) => new Promise(res => {
  P.tap = { bunny, next: start, done: new Set(), res };
  showHand(bunny.cubes[0]);
});
function numBox(n) {

async function question([a, b], tok) {
  clearStage(); instr(''); $('#choices').innerHTML = ''; $('#hintBtn').style.display = 'none';
  const sum = a + b, f = fact(a, b), st = stageOf(f);
  setEq(a, b);
  const A = new Bunny(a), B = new Bunny(b);
  const gap = .8; A.root.position.x = -(gap + A.width / 2); B.root.position.x = gap + B.width / 2;
  const cx = (A.root.position.x + B.root.position.x) / 2; A.root.position.x -= cx; B.root.position.x -= cx;
  stageDyn.add(A.root, B.root);
  fitStage(A.width + B.width + gap * 2 + 3.2, 8.2, 3.4, 150, 250);
  let boxes = null, opened = st < 4;
  const openBoxes = async () => {
    if (opened) return; opened = true; P.onBox = null;
    AC.magic();
    await Promise.all(boxes.map(async (bx, i) => { await wait(i * .15); burst(bx.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 1, .5)), { n: 12, emojis: ['✨', '🎀', '💖'] }); unanchor(bx.userData.an); await tween(.25, k => bx.scale.setScalar(.8 * (1 - k))); stageDyn.remove(bx); }));
    A.labelOn = B.labelOn = true; await Promise.all([A.dropIn(0, 4), B.dropIn(.1, 4)]);
  };
  if (st === 4) {
    A.root.visible = B.root.visible = false; A.labelOn = B.labelOn = false;
    boxes = [numBox(a), numBox(b)]; boxes[0].position.copy(A.root.position); boxes[1].position.copy(B.root.position);
    stageDyn.add(...boxes); boxes.forEach(bx => { const s = bx.scale.x; bx.scale.setScalar(.01); tween(.5, k => bx.scale.setScalar(s * Math.max(.01, k)), ease.back); });
    P.onBox = () => { AC.shake(); boxes.forEach(bx => tween(.3, k => bx.rotation.z = Math.sin(k * Math.PI * 4) * .12, ease.lin)); };
  } else { A.dropIn(0); await wait(.25); B.dropIn(0); }
  await wait(.7); guard(tok);
  await Voice.say(`${YOMI[a]} たす ${YOMI[b]} は いくつかな？`); guard(tok);

  if (st === 1) {
    instr('👆 ブロックを タッチして かぞえよう'); Voice.say('ブロックを タッチして かぞえてね');
    await tapCount(A, 1); guard(tok);
    await tapCount(B, a + 1); guard(tok);
    instr('ぜんぶで いくつ だった？'); Voice.say('ぜんぶで いくつ だった？');
  } else if (st === 2) {
    const [L, Sm] = a >= b ? [A, B] : [B, A];
    L.cubes.forEach((c, i) => L.glow(i)); L.showBadge(L.tall - 1, L.n); L.popCube(L.tall - 1); AC.sparkle(); L.hop({ h: .5 });
    instr(`<b style="color:${INK[L.n]};font-size:34px">${L.n}</b> の つぎから かぞえよう`);
    await Voice.say(`${YOMI[L.n]}！ ${YOMI[L.n]}の つぎから かぞえてね`); guard(tok);
    await tapCount(Sm, L.n + 1); guard(tok);
    instr('ぜんぶで いくつ だった？'); Voice.say('ぜんぶで いくつ？');
  } else {
    instr(st === 3 ? 'いくつに なるかな？' : 'はこの なかは なにかな？ こたえを えらんでね');
  }

  // こたえ
  const correct = sum;
  const cands = [sum - 1, sum + 1, sum - 2, sum + 2].filter(v => v >= 2 && v <= 10 && v !== sum);
  const opts = shuffle([sum, ...shuffle(cands.slice(0, 2).concat(shuffle(cands.slice(2)))).slice(0, 2)]);
  const pic = st <= 2;
  let firstTry = true, hinted = false, lock = false; const t0 = performance.now();
  const box = $('#choices'); box.innerHTML = '';
  let resolveAns; const answered = new Promise(r => resolveAns = r);
  const demo = async () => { // いっしょに かぞえる
    lock = true; $('#hintBtn').style.display = 'none';
    await openBoxes(); guard(tok);
    A.clearBadges(); B.clearBadges(); A.unglowAll(); B.unglowAll();
    await A.countAll({ tok, gap: .4 }); await B.countAll({ from: a + 1, tok, gap: .4 });
    instr('いくつ だったかな？'); lock = false;
  };
  opts.forEach((v, i) => {
    const bt = document.createElement('button'); bt.className = 'choice' + (pic ? ' pic' : '');
    bt.style.setProperty('--c', MAIN[v] === '#ffd9ee' ? '#f3b6d8' : MAIN[v]); bt.style.setProperty('--ink', INK[v]); bt.style.animationDelay = i * .08 + 's';
    bt.innerHTML = (pic ? miniBlocks(v) : '') + `<span class="cn">${v}</span>`;
    bt.onclick = () => run(async () => {
      if (lock || bt.classList.contains('wrong')) return;
      if (v === correct) { lock = true; bt.classList.add('right'); resolveAns(); return; }
      firstTry = false; bt.classList.add('wrong'); AC.boing(); lock = true;
      await Voice.say(pick(['おしい！', 'ざんねん！', 'あれれ？']) + ' いっしょに かぞえて みよう'); guard(tok);
      await demo();
    });
    box.appendChild(bt);
  });
  if (st >= 3) {
    const hb = $('#hintBtn'); hb.textContent = st === 4 ? '🎁 あけてみる' : '💡 かぞえる'; hb.style.display = '';
    hb.onclick = () => run(async () => {
      if (lock) return; AC.pop(); hinted = true;
      if (!opened) { lock = true; await openBoxes(); guard(tok); lock = false; hb.textContent = '💡 かぞえる'; return; }
      await demo();
    });
  }
  await answered; guard(tok);
  const time = performance.now() - t0;
  $('#hintBtn').style.display = 'none';

  // せいかい！ がったい
  AC.fanfare(); setEq(a, b, sum); instr('');
  await wait(.4); guard(tok);
  $('#choices').innerHTML = '';
  if (!opened) { await openBoxes(); guard(tok); }
  const counted = A.cubes.some(c => c.userData.badge);
  await Promise.all([A.hop({ h: .6 }), B.hop({ h: .6 })]); guard(tok);
  if (!counted) { A.unglowAll(); B.unglowAll(); }
  await A.absorb(B); guard(tok);
  { const x0 = A.root.position.x; await tween(.5, k => A.root.position.x = x0 * (1 - k)); }
  if (!counted) { await A.countFive({ tok }); }
  A.setHappy(true);
  burst(new THREE.Vector3(0, A.tall * .7, 1), { n: 22, emojis: ['💖', '✨', '⭐', '🌸', '🎀'], speed: 5 });
  instr(`<span style="color:${INK[a]}">${a}</span> たす <span style="color:${INK[b]}">${b}</span> は <b style="color:${INK[sum]};font-size:36px">${sum}</b>`);
  A.hop({ h: 1 });
  await Voice.say(`${YOMI[a]} たす ${YOMI[b]} は ${YOMI[sum]}！ ${firstTry ? pick(['すごい！', 'やったね！', 'せいかい！', 'かんぺき！', 'じょうず！']) : 'できたね！'}`); guard(tok);
  record(a, b, { first: firstTry, time, hinted, st });
  for (const n of [a, b, sum]) if (!S.met.includes(n) && n <= S.unlocked) S.met.push(n);
  P.log.push({ a, b, sum, firstTry });
  await wait(.8); guard(tok);
}

  accs.forEach(it => {
    const b = document.createElement('button'); b.innerHTML = `${it.icon}<small>${it.name}</small>`; if (cur === it.id) b.className = 'sel';
    b.onclick = () => { AC.sparkle(); S.outfits[dressSel] = it.id; save(); renderDress(false); dressBunny.setHappy(true); dressBunny.hop({ h: .8 }); burst(new THREE.Vector3(0, dressBunny.tall + .5, .8), { n: 12, emojis: ['✨', '💖'] }); Voice.say(pick(['かわいい！', 'にあうね！', 'すてき！'])); };
    box.appendChild(b);
  });
}

/* ================= おうちの人 ================= */
function parentPanel() {
  let rows = '<tr><th></th>' + Array.from({ length: 9 }, (_, i) => `<th>+${i + 1}</th>`).join('') + '</tr>';
  for (let a = 1; a <= 9; a++) {
    rows += `<tr><th>${a}</th>`;
    for (let b = 1; b <= 9; b++) {
      if (a + b > 10) { rows += '<td class="na"></td>'; continue; }
      const f = S.facts[fkey(a, b)]; const cls = f && f.seen ? 'b' + f.box : ''; rows += `<td class="${cls}" title="${a}+${b}">${f && f.seen ? (f.box >= 4 ? '★' : f.ok + '/' + f.seen) : ''}</td>`;
    }
    rows += '</tr>';
  }
  const seg = (key, vals, labels) => `<div class="seg" data-k="${key}">${vals.map((v, i) => `<button data-v="${v}" class="${String(S.settings[key] ?? S[key]) === String(v) ? 'sel' : ''}">${labels[i]}</button>`).join('')}</div>`;
  const c = modal(`<h2>おうちの人へ</h2>
    <p class="small">これまで ${S.total}もん ／ ${S.sessions}かい あそびました ／ シール ${Object.keys(S.stickers).length}まい ／ いま ${S.unlocked} までの たしざん</p>
    <table class="ptab">${rows}</table>
    <div class="legend"><span style="background:#ffe3ee">ぜんぶ数える</span><span style="background:#ffc7de">数えたす</span><span style="background:#e3cbff">見てわかる</span><span style="background:#bfe6ff">数字だけ</span><span style="background:#b5f0cd">★すらすら</span></div>
    <p class="small">表の数字は「1回目で正解した回数／出題回数」。まちがえた問題や数えている問題が、多めに出題されます。</p>
    <div class="set">こえ ${seg('voice', ['true', 'false'], ['オン', 'オフ'])}</div>
    <div class="set">BGM ${seg('bgm', ['true', 'false'], ['オン', 'オフ'])}</div>
    <div class="set">1回の もんだい数 ${seg('qn', [3, 5, 7], ['3', '5', '7'])}</div>
    <div class="set">こたえの 大きさ（〜まで） ${seg('unlocked', [5, 6, 7, 8, 9, 10], ['5', '6', '7', '8', '9', '10'])}</div>
    <p class="small">ふだんは自動で少しずつ大きな数に進みます（新しい友だちが登場）。</p>
    <div class="row"><button class="btn white" id="pReset" style="font-size:16px">データを けす</button><button class="btn" id="pClose">とじる</button></div>`);
  c.querySelectorAll('.seg').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = sg.dataset.k, v = b.dataset.v; AC.tap();
    if (k === 'unlocked') { S.unlocked = +v; for (let n = 1; n <= S.unlocked; n++) if (!S.met.includes(n)) S.met.push(n); }
    else S.settings[k] = k === 'qn' ? +v : v === 'true';
    save(); AC.applyBgm(); if (!S.settings.voice) Voice.stop(); parentPanel();
  }));
  c.querySelector('#pClose').onclick = () => { AC.pop(); closeModal(); enterGarden(); };
  c.querySelector('#pReset').onclick = () => { if (confirm('ほんとうに すべての きろくを けしますか？')) { S = DEF(); save(); closeModal(); location.reload(); } };
}
{ // ながおしで ひらく
  const b = $('#parentBtn'); let t = null;
  const start = e => { e.preventDefault(); b.classList.add('hold'); t = setTimeout(() => { b.classList.remove('hold'); AC.pop(); parentPanel(); }, 1200); };
  const stop = () => { b.classList.remove('hold'); clearTimeout(t); };
  b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  b.addEventListener('click', () => { if (!$('#modal').classList.contains('on')) { bigTip('ながおし してね'); } });
}
function bigTip(t) { const el = document.createElement('div'); el.className = 'pill'; el.textContent = t; Object.assign(el.style, { position: 'fixed', right: '20px', top: '110px', zIndex: 20, pointerEvents: 'none' }); document.body.appendChild(el); setTimeout(() => el.remove(), 1200); }

/* ================= ボタン ================= */
$('#playBtn').onclick = () => { AC.pop(); startSession(); };
$('#calBtn').onclick = () => { AC.pop(); showCalendar(new Date(), null, null); };
$('#dressBtn').onclick = () => { AC.pop(); enterDress(); };
$('#dBack').onclick = () => { AC.pop(); dressBunny = null; enterGarden(); };
$('#homeBtn').onclick = () => {
  AC.pop();
  const c = modal('<h2>おにわに もどる？</h2><div class="row"><button class="btn white" id="hN">つづける</button><button class="btn" id="hY">もどる</button></div>');
  c.querySelector('#hN').onclick = () => { AC.pop(); closeModal(); };
  c.querySelector('#hY').onclick = () => { AC.pop(); closeModal(); enterGarden(); };
};
$('#startBtn').onclick = () => {
  AC.init(); Voice.init(); AC.pop();
  if (!S.introDone) intro();
  else { enterGarden(); Voice.say(pick(['おかえり！', 'きょうも あそぼう！', 'まってたよ！'])); }
};
document.addEventListener('visibilitychange', () => { if (!AC.ctx) return; if (document.hidden) { AC.ctx.suspend(); Voice.stop(); } else AC.ctx.resume(); });

/* ================= タイトル画面の うさぎ ================= */
function splashScene() {
  clearStage(); garden.group.visible = false;
  const bs = [1, 2, 3, 4, 5].map((n, i) => { const b = new Bunny(n, { label: 's' }); b.root.position.x = (i - 2) * 2.3; stageDyn.add(b.root); b.dropIn(.3 + i * .15); return b; });
  if (S.outfits) bs.forEach(b => b.setAcc(S.outfits[b.n]));
  fitStage(12.5, 7, 3, H * .36, H * .25, true);
  const gen = FLOW;
  run(async () => { await wait(1.5); while (mode === 'splash' && gen === FLOW) { const b = pick(bs); if (b.alive) { b.setHappy(true); await b.hop({ h: .9 }); b.setHappy(false); } await wait(rand(.2, .8)); } });
}

/* ================= ループ ================= */
let last = performance.now(), T0 = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T0 += dt;
  updateTweens(dt);
  const k = 1 - Math.exp(-dt * 3.5); cam.pos.lerp(cam.tPos, k); cam.look.lerp(cam.tLook, k); camera.position.copy(cam.pos); camera.lookAt(cam.look);
  if (garden.group.visible) {
    garden.world.rotation.y += (garden.rot - garden.world.rotation.y) * Math.min(1, dt * 6);
    garden.decos.children.forEach(d => d.userData.tick && d.userData.tick(T0));
    clouds.forEach(c => { const u = c.userData; u.a += u.sp * dt; c.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(T0 + u.a * 3) * .3, Math.sin(u.a) * u.r); });
    garden.sky.children.forEach((s, i) => s.material.opacity = .6 + Math.sin(T0 * 2 + i) * .4);
  }
  if (stage.visible) floaters.forEach(f => { f.position.y += f.userData.v * dt; if (f.position.y > 14) f.position.y = -3; });
  stageDyn.children.forEach(o => { if (o.userData.spin) o.rotation.y += dt * 1.2; });
  for (const b of bunnies) b.update(dt);
  updateParts(dt);
  renderer.render(scene, camera);
  updateAnchors();
  requestAnimationFrame(loop);
}
onResize(); splashScene(); requestAnimationFrame(loop);
window.__kzReady = true; $('#loadMsg').style.display = 'none';
window.KZ = { P, tapCube, garden, gardenMerge, get mode() { return mode; }, S, startSession, enterGarden, intro, enterDress, openGift: () => run(() => openGift(FLOW)), newFriend: n => run(() => newFriend(n, FLOW)), save };
</script>
