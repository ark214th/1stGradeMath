<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffc9e6">
<title>ゆめかわ かんじ まほうえほん</title>
<style>
:root{--ink:#7a3563;--pink:#ff7fbf;--deep:#d94b93;--lav:#b9a2ff;--mint:#4fd1a8;--cream:#fff8fc;--top:64px;--bs:520px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Yu Gothic",sans-serif;color:var(--ink);touch-action:manipulation;background:#ffd9ec}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 90% 45%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(circle at 8% 70%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(ellipse at 20% 0%,#ffd0ec 0%,transparent 55%),
  radial-gradient(ellipse at 100% 10%,#e3d2ff 0%,transparent 50%),
  linear-gradient(180deg,#ffc9e6 0%,#f1d3ff 38%,#d6ecff 72%,#d4fbef 100%)}
.screen{position:fixed;inset:0;display:none;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.on{display:flex;flex-direction:column}

/* ボタン */
.btn{border-radius:999px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffa6d4,#ff6fb3);box-shadow:0 6px 0 var(--deep),0 12px 24px rgba(200,60,130,.25);padding:14px 30px;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(180,40,110,.3);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.btn.lav{background:linear-gradient(180deg,#cbb8ff,#9d82f5);box-shadow:0 6px 0 #7258d6,0 12px 24px rgba(110,80,200,.22)}
.btn.lav:active{box-shadow:0 2px 0 #7258d6}
.btn.mint{background:linear-gradient(180deg,#9ff0d4,#4fd1a8);box-shadow:0 6px 0 #2ea883,0 12px 24px rgba(40,160,120,.22);text-shadow:0 2px 0 rgba(20,120,90,.3)}
.btn.mint:active{box-shadow:0 2px 0 #2ea883}
.btn.white{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 6px 0 #f0bcd8,0 12px 24px rgba(200,60,130,.15)}
.btn.white:active{box-shadow:0 2px 0 #f0bcd8}
.btn.small{font-size:20px;padding:10px 20px}
.btn[hidden]{display:none}
.ibtn{background:rgba(255,255,255,.92);border-radius:20px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 0 #f0bcd8,0 8px 16px rgba(200,60,130,.12);flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #f0bcd8}
.ibtn.off{opacity:.45}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:8px 18px;font-weight:900;box-shadow:0 4px 0 rgba(200,90,150,.15);white-space:nowrap}
@keyframes pop{0%{scale:.3;opacity:0}100%{scale:1;opacity:1}}
@keyframes breath{50%{scale:1.06}}
@keyframes floaty{50%{translate:0 -10px}}
@keyframes wob{20%{rotate:-6deg}40%{rotate:5deg}60%{rotate:-3deg}80%{rotate:2deg}}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

/* ユニコ（ふきだし つき） */
.uni{display:flex;align-items:flex-end;gap:8px}
.uni .face{font-size:64px;line-height:1;animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(150,60,130,.2))}
.say{background:#fff;border-radius:24px;padding:10px 18px;font-size:22px;font-weight:900;box-shadow:0 5px 0 rgba(200,90,150,.12),0 10px 20px rgba(160,60,120,.12);position:relative;margin-bottom:22px;line-height:1.4;text-wrap:balance;max-width:min(400px,40vw)}
.say:after{content:"";position:absolute;left:-12px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}

/* タイトル */
#title{align-items:center;justify-content:space-around;text-align:center}
#title h1{margin:0;font-size:clamp(38px,6.6vw,74px);line-height:1.15;color:#fff;letter-spacing:.04em;text-shadow:0 4px 0 #ff82bf,0 8px 0 #c77dff,0 14px 24px rgba(160,60,140,.3);-webkit-text-stroke:2px #ff9fd0}
#title .sub{font-weight:900;font-size:22px;color:#a04a86;margin-top:20px}
.tdeco{font-size:clamp(46px,8vw,84px);display:flex;gap:18px;justify-content:center}
.tdeco span{animation:floaty 2.6s ease-in-out infinite}
.tdeco span:nth-child(2){animation-delay:.4s}.tdeco span:nth-child(3){animation-delay:.8s}
#startBtn{font-size:34px;padding:18px 56px;animation:breath 1.6s ease-in-out infinite}

/* ホーム */
.topbar{display:flex;align-items:center;gap:10px;height:var(--top);flex:none}
.topbar .grow{flex:1}
.logo{font-size:22px;font-weight:900;color:#c24d8f;background:rgba(255,255,255,.75);padding:8px 16px;border-radius:999px}
#home .body{flex:1;display:flex;align-items:center;justify-content:center;gap:4vw;min-height:0}
.todayBox{background:rgba(255,255,255,.82);border-radius:36px;padding:22px 26px;box-shadow:0 8px 0 rgba(200,90,150,.15),0 18px 34px rgba(160,60,140,.15);display:flex;flex-direction:column;align-items:center;gap:16px}
.todayBox h2{margin:0;font-size:28px}
.cards3{display:flex;gap:16px}
.mini{width:110px;height:110px;border-radius:26px;background:linear-gradient(160deg,#fff,#ffeaf5);display:flex;align-items:center;justify-content:center;font-size:62px;box-shadow:inset 0 0 0 4px #ffd0e7;position:relative}
.mini.done:after{content:"✔";position:absolute;right:-8px;top:-8px;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.mini .q{font-size:56px;color:#e0a9cb}
.side{display:flex;flex-direction:column;gap:18px;align-items:center}
.count{font-size:20px;font-weight:900;text-align:center;background:rgba(255,255,255,.75);border-radius:22px;padding:10px 18px}
.count b{font-size:34px;color:var(--deep)}

/* レッスン */
.steps{display:flex;gap:8px;align-items:center}
.steps i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 3px #f5c2df}
.steps i.on{background:var(--pink);box-shadow:none}
.steps i.now{background:#fff;box-shadow:inset 0 0 0 5px var(--pink);scale:1.25}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,40px);min-height:0}
.board{width:var(--bs);height:var(--bs);flex:none;position:relative;border-radius:34px;background:#fff;box-shadow:0 8px 0 #f3c3dd,0 18px 36px rgba(160,60,140,.18);touch-action:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:44vw;min-width:0}
.yomi{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.word{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-radius:24px;padding:8px 10px 8px 20px;box-shadow:0 5px 0 rgba(200,90,150,.12);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.word .w{font-size:54px;font-weight:900;line-height:1.1;white-space:nowrap}
.word .w em{font-style:normal;color:var(--deep)}
.word .r{font-size:22px;font-weight:900;color:#b0759c;white-space:nowrap}
.word .ibtn{width:50px;height:50px;font-size:24px;margin-left:auto}
.bigmsg{font-size:30px;font-weight:900;text-align:center;line-height:1.35}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* であう（えが かんじに かわる） */
.pic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;font-size:calc(var(--bs) * .5);line-height:1;transition:scale .7s cubic-bezier(.5,-0.4,.6,1),opacity .6s,filter .6s;pointer-events:none}
.pic.many{font-size:calc(var(--bs) * .3)}
.pic.stars{font-size:calc(var(--bs) * .15);gap:2% 4%;padding:12%}
.pic.num{font-size:calc(var(--bs) * .3);font-weight:900;color:#ff8cc6;text-shadow:0 6px 0 #ffd0e7}
.pic.gone{scale:.2;opacity:0;filter:blur(6px)}
.wand{position:absolute;right:-14px;bottom:-14px;width:96px;height:96px;border-radius:50%;font-size:52px;background:linear-gradient(160deg,#fff7d6,#ffd0ec);box-shadow:0 6px 0 #e6a6cc,0 10px 20px rgba(160,60,140,.25);animation:breath 1.2s ease-in-out infinite;z-index:3}
.wand:active{transform:translateY(3px)}
.flash{position:absolute;inset:0;border-radius:34px;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.0) 70%);opacity:0;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* ずかん */
#zukan .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 30px;touch-action:pan-y}
.grp{margin:10px 0 18px}
.grp h3{display:inline-block;margin:0 0 10px;padding:6px 16px;border-radius:999px;color:#fff;font-size:20px;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.cells{display:flex;flex-wrap:wrap;gap:12px}
.cell{width:92px;height:104px;border-radius:22px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:rgba(122,53,99,.28);position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8)}
.cell.met{background:#fff;color:var(--ink);box-shadow:0 5px 0 #f3c3dd}
.cell .st{font-size:15px;height:18px;line-height:18px;letter-spacing:-1px}
.cell.s3{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#ff8fa3,#ffe066,#7fd0f5,#e79bff) border-box;border:4px solid transparent}
.credit{font-size:12px;color:#a2789a;text-align:center;margin-top:16px;line-height:1.6}
.credit a{color:inherit}

/* クイズ */
#quiz .stage{flex-direction:column;gap:18px}
.qhead{display:flex;align-items:center;gap:16px}
.qword{font-size:clamp(56px,10vh,96px);font-weight:900;background:#fff;border-radius:30px;padding:6px 34px;box-shadow:0 8px 0 #f3c3dd;line-height:1.2;white-space:nowrap}
.qword em{font-style:normal;color:var(--deep)}
.qq{font-size:28px;font-weight:900}
.choices{display:flex;gap:clamp(12px,2.4vw,28px)}
.choice{min-width:clamp(140px,22vw,230px);min-height:clamp(96px,22vh,170px);border-radius:30px;background:#fff;font-weight:900;font-size:clamp(30px,5vh,44px);box-shadow:0 8px 0 #e4b6d6,0 14px 26px rgba(160,60,140,.15);padding:10px 18px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.choice.kanji{font-size:clamp(54px,11vh,92px)}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 #e4b6d6}
.choice.no{animation:shake .45s;opacity:.45}
.choice.yes{background:linear-gradient(180deg,#fff,#d9fff0);box-shadow:0 8px 0 #63d3aa,0 0 0 6px #9ff0d4;animation:wob .6s}

/* おいわい */
#party{background:rgba(255,230,245,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:20}
.pbox{background:#fff;border-radius:40px;padding:26px 40px;text-align:center;box-shadow:0 10px 0 #f3c3dd,0 24px 50px rgba(160,60,140,.25);animation:pop .5s cubic-bezier(.3,1.6,.5,1);max-width:92vw}
.pbox h2{margin:0 0 6px;font-size:40px;color:var(--deep)}
.pbox .stk{display:flex;gap:14px;justify-content:center;margin:14px 0 20px}
.sticker{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#fff,#ffe3f2);box-shadow:inset 0 0 0 5px #ffc2e2,0 6px 0 #f3c3dd;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(140deg)}}

/* iPhone よこ など ひくい画面 */
@media (max-height:520px){
  :root{--top:50px}
  .ibtn{width:46px;height:46px;font-size:22px;border-radius:16px}
  .btn{font-size:20px;padding:10px 20px}
  .btn.small{font-size:16px;padding:8px 14px}
  .logo{font-size:17px;padding:6px 12px}
  .uni .face{font-size:44px}
  .say{font-size:17px;padding:8px 14px;margin-bottom:12px}
  .word .w{font-size:30px}.word .r{font-size:16px}.word .ibtn{width:40px;height:40px;font-size:20px}
  .bigmsg{font-size:22px}
  .mini{width:84px;height:84px;font-size:46px}
  .todayBox{padding:14px 18px;gap:10px}.todayBox h2{font-size:22px}
  .count{font-size:16px}.count b{font-size:26px}
  .wand{width:72px;height:72px;font-size:38px}
  .qq{font-size:22px}
  .choice{min-height:84px}
  .cell{width:74px;height:84px;font-size:42px}
  .pbox{padding:16px 26px}.pbox h2{font-size:30px}.sticker{width:72px;height:72px;font-size:40px}
  #title .sub{font-size:18px}
  #startBtn{font-size:26px;padding:12px 40px}
}
/* たて もち */
@media (max-aspect-ratio:1/1){
  .stage{flex-direction:column}
  .panel{max-width:94vw}
  #home .body{flex-direction:column}
}
</style>
</head>
<body>
<div id="bg"></div>

<!-- タイトル -->
<section class="screen on" id="title">
  <div class="tdeco"><span>🦄</span><span>📖</span><span>🌈</span></div>
  <div>
    <h1>ゆめかわ<br>かんじ まほうえほん</h1>
    <div class="sub">えが かんじに へんしん！ なぞって おぼえよう</div>
  </div>
  <button class="btn" id="startBtn">はじめる</button>
</section>

<!-- ホーム -->
<section class="screen" id="home">
  <div class="topbar">
    <div class="logo">🦄 かんじ まほうえほん</div>
    <div class="grow"></div>
    <button class="ibtn" id="voiceBtn" aria-label="こえ">🗣️</button>
    <button class="ibtn" id="bgmBtn" aria-label="おんがく">🎵</button>
  </div>
  <div class="body">
    <div class="todayBox">
      <h2 id="todayTitle">きょうの まほう</h2>
      <div class="cards3" id="todayCards"></div>
      <button class="btn" id="goToday">はじめる ✨</button>
    </div>
    <div class="side">
      <div class="uni"><div class="face">🦄</div><div class="say" id="homeSay">こんにちは！</div></div>
      <div class="count">であった かんじ<br><b id="metCount">0</b> / 80</div>
      <button class="btn lav" id="goZukan">📖 ずかん</button>
    </div>
  </div>
</section>

<!-- レッスン（であう・なぞる） -->
<section class="screen" id="lesson">
  <div class="topbar">
    <button class="ibtn" id="lessonHome" aria-label="もどる">🏠</button>
    <div class="steps" id="steps"></div>
    <div class="grow"></div>
    <div class="pill" id="lessonLabel"></div>
  </div>
  <div class="stage">
    <div class="board" id="board">
      <svg id="boardSvg" viewBox="0 0 109 109"></svg>
      <div class="pic" id="pic"></div>
      <div class="flash" id="flash"></div>
      <button class="wand" id="wand" aria-label="まほう">🪄</button>
    </div>
    <div class="panel">
      <div class="uni"><div class="face">🦄</div><div class="say" id="lessonSay"></div></div>
      <div class="yomi" id="yomi"></div>
      <div class="btnrow">
        <button class="btn white small" id="replayBtn" hidden>▶ かきじゅん</button>
        <button class="btn" id="nextBtn" hidden>つぎへ ▶</button>
        <button class="btn lav" id="againBtn" hidden>もう いっかい</button>
      </div>
    </div>
  </div>
</section>

<!-- よみクイズ -->
<section class="screen" id="quiz">
  <div class="topbar">
    <button class="ibtn" id="quizHome" aria-label="もどる">🏠</button>
    <div class="steps" id="qsteps"></div>
    <div class="grow"></div>
    <div class="pill">よみ クイズ</div>
  </div>
  <div class="stage">
    <div class="qhead" id="qhead"></div>
    <div class="qq" id="qq"></div>
    <div class="choices" id="choices"></div>
  </div>
</section>

<!-- ずかん -->
<section class="screen" id="zukan">
  <div class="topbar">
    <button class="ibtn" id="zukanHome" aria-label="もどる">🏠</button>
    <div class="logo">📖 かんじ ずかん</div>
    <div class="grow"></div>
    <div class="pill" id="zukanCount"></div>
  </div>
  <div class="list" id="zlist"></div>
</section>

<!-- おいわい -->
<section class="screen" id="party">
  <div class="pbox">
    <h2 id="partyTitle">できた！</h2>
    <div class="bigmsg" id="partyMsg"></div>
    <div class="stk" id="partyStk"></div>
    <div class="btnrow" id="partyBtns"></div>
  </div>
</section>

<div id="fx"></div>

<script src="kanji-strokes.js"></script>
<script src="kanji-data.js"></script>
<script src="kanji-core.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const { DATA, ORDER, GROUPS } = window.KANJI_DATA;
const STROKES = window.KANJI_STROKES;
const Core = window.KanjiCore;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SVGNS = 'http://www.w3.org/2000/svg';

/* ================= きろく ================= */
let S;
try { S = Core.normalizeState(JSON.parse(localStorage.getItem(Core.SAVE_KEY) || 'null')); } catch (e) { S = Core.freshState(); }
const save = () => { try { localStorage.setItem(Core.SAVE_KEY, JSON.stringify(S)); } catch (e) {} };
const rec = k => (S.kanji[k] || (S.kanji[k] = { traced: 0, quiz: 0, last: '' }));
const metCount = () => ORDER.filter(k => S.kanji[k] && S.kanji[k].traced > 0).length;

/* ================= おと ================= */
const AC = {
  ctx: null,
  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    this.ctx = new C();
    this.out = this.ctx.createGain(); this.out.gain.value = .9; this.out.connect(this.ctx.destination);
    this.sfx = this.ctx.createGain(); this.sfx.gain.value = .55; this.sfx.connect(this.out);
    this.bgm = this.ctx.createGain(); this.bgm.gain.value = 0; this.bgm.connect(this.out);
    this.startBgm();
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  note(f, t0, dur, { type = 'sine', vol = .3, g = this.sfx, slide = 0, attack = .006 } = {}) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), a = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + dur);
    a.gain.setValueAtTime(.0001, t0); a.gain.exponentialRampToValueAtTime(vol, t0 + attack); a.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(a); a.connect(g); o.start(t0); o.stop(t0 + dur + .05);
  },
  tap() { const t = this.now(); this.note(880, t, .1, { type: 'triangle', vol: .18, slide: 1.4 }); },
  stroke(n) { const sc = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349]; const f = sc[n % sc.length], t = this.now(); this.note(f, t, .35, { type: 'triangle', vol: .26 }); this.note(f * 2, t, .25, { vol: .06 }); },
  sparkle() { const t = this.now(); [1319, 1568, 1760, 2093, 2637, 3136].forEach((f, i) => this.note(f, t + i * .055, .35, { vol: .11 })); },
  magic() { const t = this.now(); for (let i = 0; i < 12; i++) this.note(600 + i * 150, t + i * .045, .3, { vol: .08 }); },
  fanfare() { const t = this.now(); [[523, 0], [659, .11], [784, .22], [1047, .33]].forEach(([f, d]) => { this.note(f, t + d, .5, { type: 'triangle', vol: .26 }); this.note(f / 2, t + d, .4, { vol: .1 }); }); this.note(1319, t + .45, .9, { vol: .13 }); this.note(1568, t + .45, .9, { vol: .1 }); },
  boing() { const t = this.now(); this.note(330, t, .35, { vol: .2, slide: .7 }); },
  startBgm() {
    // オルゴール風の やさしい ループ
    const N = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, C6: 1046.5, D6: 1174.66 };
    const mel = ['C5', 'E5', 'G5', 'E5', 'F5', 'A5', 'G5', 0, 'E5', 'G5', 'C6', 'G5', 'A5', 'G5', 'E5', 0,
      'D5', 'F5', 'A5', 'F5', 'E5', 'G5', 'C6', 0, 'D6', 'C6', 'A5', 'G5', 'E5', 'D5', 'C5', 0];
    const bass = [130.81, 174.61, 146.83, 196];
    const step = 60 / 92 / 2; let next = this.ctx.currentTime + .2, i = 0;
    setInterval(() => {
      if (!this.ctx || this.ctx.state !== 'running') return;
      while (next < this.ctx.currentTime + .4) {
        const m = mel[i % 32];
        if (m) { this.note(N[m], next, .9, { vol: .14, g: this.bgm }); this.note(N[m] * 2, next, .5, { vol: .025, g: this.bgm }); }
        if (i % 8 === 0) { const b = bass[Math.floor(i / 8) % 4]; this.note(b * 2, next, 1.6, { type: 'triangle', vol: .08, g: this.bgm }); }
        next += step; i++;
      }
    }, 120);
    this.applyBgm();
  },
  ducked: false,
  applyBgm() { if (!this.ctx) return; const v = S.settings.bgm ? (this.ducked ? .1 : .32) : 0; this.bgm.gain.setTargetAtTime(v, this.ctx.currentTime, .25); },
  duck(on) { this.ducked = on; this.applyBgm(); },
};

const Voice = {
  ok: 'speechSynthesis' in window, v: null,
  init() {
    if (!this.ok) return;
    const pv = () => {
      const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
      this.v = vs.find(v => /Kyoko|O-ren|Nanami|Haruka|Ayumi|Mizuki/i.test(v.name)) || vs.find(v => /Google/i.test(v.name)) || vs[0] || null;
    };
    pv(); speechSynthesis.onvoiceschanged = pv;
  },
  say(text, { pitch = 1.25, rate = .95 } = {}) {
    return new Promise(res => {
      if (!this.ok || !S.settings.voice) { setTimeout(res, 150); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; if (this.v) u.voice = this.v; u.pitch = pitch; u.rate = rate;
      let done = false; const fin = () => { if (done) return; done = true; AC.duck(false); res(); };
      u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 260);
      AC.duck(true); speechSynthesis.speak(u);
    });
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
};

function sparks(x, y, n = 14, chars = ['✨', '💖', '⭐', '🌸', '💫']) {
  const fx = $('#fx');
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = chars[i % chars.length];
    const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 140;
    s.style.left = (x - 14) + 'px'; s.style.top = (y - 14) + 'px';
    s.style.setProperty('--dx', Math.cos(a) * r + 'px'); s.style.setProperty('--dy', Math.sin(a) * r + 'px');
    s.style.animationDelay = (Math.random() * .15) + 's';
    fx.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }
}
const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

let screen = 'title';
function show(id) {

  screen = id;

}
function layout() {
  const W = innerWidth, H = innerHeight;
  const top = H <= 520 ? 50 : 64;
  let bs;
  if (W >= H) bs = Math.min(H - top - 40, W * 0.5);
  else bs = Math.min(W - 40, (H - top) * 0.5);
  document.documentElement.style.setProperty('--bs', Math.max(200, Math.floor(bs)) + 'px');
}

const hl = (w, k) => w.split(k).map(t => t.replace(/[&<>]/g, '')).join('<em>' + k + '</em>');

/* ================= ばん（SVG） ================= */
const svg = $('#boardSvg');
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const a in attrs) e.setAttribute(a, attrs[a]);
  if (parent) parent.appendChild(e);
  return e;
}
const Board = {
  k: null, paths: [], done: 0, layers: {},
  setup(k) {
    this.k = k; this.done = 0;
    svg.innerHTML = '';
    const defs = el('defs', {}, svg);
    const g = el('linearGradient', { id: 'ink', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
    el('stop', { offset: '0', 'stop-color': '#ff6fb3' }, g); el('stop', { offset: '.55', 'stop-color': '#c77dff' }, g); el('stop', { offset: '1', 'stop-color': '#5fb8ff' }, g);
    // 十字の点線（ドリルの マス）
    const grid = el('g', { stroke: '#f6cfe3', 'stroke-width': .6, 'stroke-dasharray': '2 2.2' }, svg);
    el('line', { x1: 54.5, y1: 4, x2: 54.5, y2: 105 }, grid); el('line', { x1: 4, y1: 54.5, x2: 105, y2: 54.5 }, grid);
    this.layers.model = el('g', { fill: 'none', stroke: '#f9dbea', 'stroke-width': 7.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    this.layers.done = el('g', { fill: 'none', stroke: 'url(#ink)', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    this.layers.anim = el('g', { fill: 'none', stroke: '#ff7fbf', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    this.layers.hint = el('g', {}, svg);
    this.layers.user = el('g', { fill: 'none', stroke: '#8f6bff', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .85 }, svg);
    this.paths = STROKES[k];
    this.models = this.paths.map(d => el('path', { d }, this.layers.model));
  },
  showModel(on) { this.layers.model.style.opacity = on ? 1 : 0; },
  clearDone() { this.layers.done.innerHTML = ''; this.done = 0; },
  clearAnim() { this.layers.anim.innerHTML = ''; },
  addDone(i) { el('path', { d: this.paths[i] }, this.layers.done); },
  // 1画を 書くように うごかす
  async drawStroke(i, ms = 520, layer = this.layers.anim, cls) {
    const p = el('path', { d: this.paths[i] }, layer);
    if (cls) p.setAttribute('class', cls);
    const L = p.getTotalLength() + 1;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${ms}ms ease-in-out`;
    p.style.strokeDashoffset = 0;
    await sleep(ms + 40);
    return p;
  },
  // かきじゅん アニメ（ばんごう つき）
  async playOrder(token) {
    this.clearAnim(); this.clearHint();
    for (let i = 0; i < this.paths.length; i++) {
      if (token.cancel) return;
      this.number(i, '#ff6fb3');
      AC.stroke(i);
      await this.drawStroke(i, 560);
      await sleep(180);
    }
  },
  number(i, color) {
    const pts = Core.flatten(this.paths[i]);
    const [x, y] = pts[0];
    const [x2, y2] = pts[Math.min(3, pts.length - 1)];
    // はじまりの すこし うしろ に ばんごう
    let dx = x - x2, dy = y - y2; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const nx = Math.min(102, Math.max(7, x + dx * 7 - dy * 3)), ny = Math.min(102, Math.max(7, y + dy * 7 + dx * 3));
    const g = el('g', {}, this.layers.hint);
    el('circle', { cx: nx, cy: ny, r: 5, fill: color || '#ff6fb3' }, g);
    const t = el('text', { x: nx, y: ny + 2.4, 'text-anchor': 'middle', 'font-size': 7, 'font-weight': 900, fill: '#fff' }, g);
    t.textContent = i + 1;
  },
  clearHint() { this.layers.hint.innerHTML = ''; },
  // つぎの画の「ここから」
  startDot(i, strong) {
    this.clearHint();
    const [x, y] = Core.flatten(this.paths[i])[0];
    const g = el('g', {}, this.layers.hint);
    const c = el('circle', { cx: x, cy: y, r: strong ? 6 : 4.6, fill: '#4fd1a8', opacity: .9 }, g);
    c.innerHTML = `<animate attributeName="r" values="${strong ? '5;8;5' : '4;6;4'}" dur="1.1s" repeatCount="indefinite"/>`;
    this.number(i, '#ff6fb3');
  },
};

/* ================= なぞり ================= */
const Trace = {
  active: false, idx: 0, miss: 0, pts: null, line: null, onDone: null,
  start(onDone) {
    this.active = true; this.idx = 0; this.miss = 0; this.onDone = onDone;
    Board.clearDone(); Board.clearAnim(); Board.layers.user.innerHTML = '';
    Board.startDot(0);
  },
  stop() { this.active = false; this.pts = null; },
  toLocal(e) {
    const r = $('#board').getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 109, (e.clientY - r.top) / r.height * 109];
  },
  down(e) {
    if (!this.active) return;
    e.preventDefault();
    $('#board').setPointerCapture && $('#board').setPointerCapture(e.pointerId);
    this.pid = e.pointerId;
    this.pts = [this.toLocal(e)];
    Board.layers.user.innerHTML = '';
    this.line = el('polyline', { points: this.pts.map(p => p.join(',')).join(' ') }, Board.layers.user);
  },
  move(e) {
    if (!this.active || !this.pts || e.pointerId !== this.pid) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) this.pts.push(this.toLocal(ev));
    this.line.setAttribute('points', this.pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  },
  async up(e) {
    if (!this.active || !this.pts || e.pointerId !== this.pid) return;
    const pts = this.pts; this.pts = null;
    const i = this.idx;
    const r = Core.judgeStroke(pts, Board.paths[i]);
    if (r.ok) {
      Board.layers.user.innerHTML = '';
      Board.addDone(i);
      AC.stroke(i);
      const box = $('#board').getBoundingClientRect();
      const end = Core.flatten(Board.paths[i]).pop();
      sparks(box.left + end[0] / 109 * box.width, box.top + end[1] / 109 * box.height, 5, ['✨', '💖']);
      this.next();
    } else {
      this.miss++;
      AC.boing();
      const line = this.line;
      line.style.transition = 'opacity .5s'; line.style.opacity = 0;
      setTimeout(() => line.remove(), 520);
      if (this.miss >= 3) {
        // 3かい むずかしかったら いっしょに かく
        this.active = false;
        Say.lesson('いっしょに かこうね');
        Board.clearHint();
        await Board.drawStroke(i, 700, Board.layers.done);
        AC.stroke(i);
        this.active = true;
        this.next();
        return;
      }
      if (r.reason === 'reverse') Say.lesson('みどりの まるから かくよ', true);
      else if (r.reason === 'start') Say.lesson(`${i + 1}ばんめは ここから だよ`, true);
      else Say.lesson('おしい！ もう いっかい', true);
      Board.startDot(i, true);
      // おてほんの うごき を みせる
      this.active = false;
      Board.clearAnim();
      await Board.drawStroke(i, 650);
      await sleep(250);
      Board.clearAnim();
      this.active = screen === 'lesson';
    }
  },
  next() {
    this.idx++; this.miss = 0;
    if (this.idx >= Board.paths.length) {
      this.active = false; Board.clearHint();
      this.onDone && this.onDone();
    } else Board.startDot(this.idx);
  },
};
const boardEl = $('#board');
boardEl.addEventListener('pointerdown', e => Trace.down(e));
boardEl.addEventListener('pointermove', e => Trace.move(e));
boardEl.addEventListener('pointerup', e => Trace.up(e));

}
function cancelToken() { if (L && L.token) L.token.cancel = true; L.token = { cancel: false }; return L.token; }

function setButtons({ replay = false, next = null, again = null } = {}) {

function renderPic(e) {

async function meet() {

  const token = cancelToken();
  Trace.stop();
  $('#steps').innerHTML = stepsHTML(L.list.length, L.i, L.i);

async function transform(k, token) {
  $('#wand').hidden = true;
  AC.magic();
  const [cx, cy] = centerOf($('#board'));
  sparks(cx, cy, 18);
  $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
  $('#pic').classList.add('gone');
  await sleep(520);
  if (token.cancel) return;
  Board.showModel(true);
  for (let i = 0; i < Board.paths.length; i++) { await Board.drawStroke(i, 200); if (token.cancel) return; }
  AC.sparkle();
  const e = DATA[k];
  const first = e.words[0];
  Say.lesson(`「${first.r}」の かんじ だよ！`);

async function order(k) {
  const token = cancelToken();
  setButtons();
  $('#nextBtn').textContent = 'つぎへ ▶';
  Board.clearAnim(); Board.clearDone(); Board.clearHint();
  Say.lesson('かきじゅんを みてね');
  Voice.say('かきじゅんを みてね');
  await Board.playOrder(token);
  if (token.cancel) return;
  await sleep(400);
  Board.clearAnim(); Board.clearHint();
  trace(k, token);
}

function trace(k, token) {
  Say.lesson('みどりの まるから なぞってね');
  Voice.say('みどりの まるから なぞってね');
  setButtons({ replay: true });
  $('#replayBtn').onclick = async () => {
    AC.tap();
    Trace.stop();
    const t = cancelToken();
    setButtons();
    Board.clearDone();
    Board.clearAnim();
    await Board.playOrder(t);
    if (t.cancel) return;
    await sleep(300);
    Board.clearAnim(); Board.clearHint();
    trace(k, t);
  };
  Trace.start(() => traced(k, token));
}

async function traced(k, token) {
  const r = rec(k);
  const before = Core.stars(r);
  r.traced++; r.last = Core.dayKey();
  save();
  AC.fanfare();
  const [cx, cy] = centerOf($('#board'));
  sparks(cx, cy, 22);
  const after = Core.stars(r);
  const msg = ['はなまる！', 'じょうず！', 'すてき！', 'きらきら！'][Math.floor(Math.random() * 4)];
  Say.lesson(after > before && before > 0 ? `${msg} ほしが ふえたよ ⭐` : `${msg} シール ゲット！`);
  Voice.say(msg);
  const nextFn = L.mode === 'today'
    ? (L.i + 1 < L.list.length ? () => { L.i++; meet(); } : () => startQuiz(L.list))
    : () => { buildZukan(); show('zukan'); };
  setButtons({ replay: false, next: nextFn, again: () => { Board.clearDone(); Board.layers.user.innerHTML = ''; trace(k, cancelToken()); } });
  $('#nextBtn').textContent = L.mode === 'today' ? (L.i + 1 < L.list.length ? 'つぎの かんじ ▶' : 'クイズ ▶') : 'ずかんへ ▶';
}

let Q = null;
function startQuiz(list) {
  Q = { qs: Core.makeQuiz(list, DATA), i: 0 };

async function askQ() {
  const q = Q.qs[Q.i];
  $('#qsteps').innerHTML = stepsHTML(Q.qs.length, Q.i, Q.i);
  const head = $('#qhead'), ch = $('#choices');
  ch.innerHTML = '';
  let locked = false;
  if (q.type === 'read') {
    head.innerHTML = `<div class="qword">${hl(q.w.w, q.k)}</div>`;
    $('#qq').textContent = 'なんて よむ かな？';
    Voice.say('なんて よむ かな？');
  } else {
    head.innerHTML = `<div class="qword" style="font-size:clamp(40px,7vh,64px)">「${q.w.r}」</div><button class="ibtn" aria-label="きく">🔊</button>`;
    head.querySelector('button').onclick = () => { AC.tap(); Voice.say(q.w.r); };
    $('#qq').textContent = 'どれ かな？';
    Voice.say(`${q.w.r}、は どれ かな？`);
  }
  q.choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice' + (q.type === 'listen' ? ' kanji' : '');
    b.innerHTML = q.type === 'read' ? c.w.r : hl(c.w.w, c.k);
    b.onclick = async () => {
      if (locked || b.classList.contains('no')) return;
      if (c.ok) {
        locked = true;
        b.classList.add('yes');
        AC.sparkle();
        sparks(...centerOf(b), 14);
        rec(q.k).quiz++; save();
        await Voice.say(q.w.r);
        await sleep(500);
        Q.i++;
        if (Q.i < Q.qs.length) askQ(); else finishToday();
      } else {
        b.classList.add('no');
        AC.boing();
        Voice.say('おしい！');
      }
    };
    ch.appendChild(b);
  });
}

function finishToday() {

  save();
  Voice.say('きょうの まほう、できたね！');
  party({
    title: 'きょうの まほう できた！',
    msg: `ずかんに シールが ついたよ（${metCount()} / 80）`,
    stickers: L.list,
    buttons: [
      { t: '📖 ずかん', cls: 'lav', f: () => { closeParty(); buildZukan(); show('zukan'); } },

  });
}

/* ================= ホーム ================= */
function todayList() {
  const day = Core.dayKey();
  if (!S.today || S.today.day !== day) { S.today = { day, list: Core.pickToday(S, ORDER, day), done: false }; save(); }
  return S.today.list;
}
function goHome() {
  Trace.stop(); if (L) cancelToken(); Voice.stop();
  const list = todayList();
  const done = S.today.done;
  $('#todayTitle').textContent = done ? 'きょうの まほう できた！' : 'きょうの まほう';
  $('#todayCards').innerHTML = list.map(k => {
    const met = S.kanji[k] && S.kanji[k].traced > 0;
    return `<div class="mini ${done ? 'done' : ''}">${met ? k : '<span class="q">？</span>'}</div>`;
  }).join('');
  $('#goToday').textContent = done ? 'もういちど ✨' : 'はじめる ✨';
  $('#metCount').textContent = metCount();
  const n = metCount();
  $('#homeSay').textContent = done ? 'また あした あそぼうね！' : n === 0 ? 'えが かんじに へんしんするよ！' : 'きょうは どんな かんじ かな？';
  updateToggles();
  show('home');
}
$('#goToday').onclick = () => {
  AC.tap();
  let list = todayList();
  if (S.today.done) {
    // もういちど：きょうの 3つ のあと、つぎの 3つ を えらびなおす
    list = Core.pickToday(S, ORDER, S.today.day);
    S.today.list = list; save();
  }
  startLesson(list, 'today');
};
$('#goZukan').onclick = () => { AC.tap(); buildZukan(); show('zukan'); };
$('#lessonHome').onclick = $('#quizHome').onclick = $('#zukanHome').onclick = () => { AC.tap(); goHome(); };

function updateToggles() {
  $('#voiceBtn').classList.toggle('off', !S.settings.voice);
  $('#bgmBtn').classList.toggle('off', !S.settings.bgm);
}
$('#voiceBtn').onclick = () => { S.settings.voice = !S.settings.voice; save(); updateToggles(); AC.tap(); if (!S.settings.voice) Voice.stop(); };
$('#bgmBtn').onclick = () => { S.settings.bgm = !S.settings.bgm; save(); updateToggles(); AC.applyBgm(); AC.tap(); };

/* ================= ずかん ================= */
function buildZukan() {
  const box = $('#zlist'); box.innerHTML = '';
  for (const g of GROUPS) {
    const ks = ORDER.filter(k => DATA[k].g === g.id);
    const sec = document.createElement('div'); sec.className = 'grp';
    sec.innerHTML = `<h3 style="background:${g.color}">${g.name}</h3><div class="cells"></div>`;
    const cells = sec.querySelector('.cells');
    for (const k of ks) {
      const st = Core.stars(S.kanji[k]);
      const c = document.createElement('button');
      c.className = 'cell' + (st ? ' met' : '') + (st === 3 ? ' s3' : '');
      c.innerHTML = `<span>${k}</span><span class="st">${st ? '⭐'.repeat(st) : ''}</span>`;
      c.onclick = () => { AC.tap(); startLesson([k], 'one'); };
      cells.appendChild(c);
    }
    box.appendChild(sec);
  }
  const cr = document.createElement('div');
  cr.className = 'credit';
  cr.innerHTML = 'かきじゅん データ: <a href="http://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> (© Ulrich Apel, CC BY-SA 3.0)';
  box.appendChild(cr);
  $('#zukanCount').textContent = `${metCount()} / 80`;
}

/* ================= はじめ ================= */
$('#startBtn').onclick = () => {
  AC.init(); Voice.init();
  AC.tap();
  goHome();
};
layout();

// テスト用：URL に ?k=山 で その字の れんしゅうから はじめる
const qk = new URLSearchParams(location.search).get('k');
if (qk && DATA[qk]) { startLesson([qk], 'one'); }
</script>
