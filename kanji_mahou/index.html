<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffc9e6">
<title>ゆめかわ かんじの しま</title>
<style>
:root{--ink:#7a3563;--pink:#ff7fbf;--deep:#d94b93;--lav:#b9a2ff;--mint:#4fd1a8;--cream:#fff8fc;--top:64px;--bs:520px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","M PLUS Rounded 1c","Yu Gothic",sans-serif;color:var(--ink);touch-action:manipulation;background:#ffd9ec}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#bg{position:fixed;inset:0;background:
  radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 60% 8%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 35% 30%,rgba(255,255,255,.7) 0 1.5px,transparent 2.5px),
  radial-gradient(circle at 90% 45%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(circle at 8% 70%,rgba(255,255,255,.7) 0 2px,transparent 3px),
  radial-gradient(ellipse at 20% 0%,#ffd0ec 0%,transparent 55%),
  radial-gradient(ellipse at 100% 10%,#e3d2ff 0%,transparent 50%),
  linear-gradient(180deg,#ffc9e6 0%,#f1d3ff 38%,#d6ecff 72%,#d4fbef 100%)}
.screen{position:fixed;inset:0;display:none;z-index:2;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.on{display:flex;flex-direction:column}

/* ボタン */
.btn{border-radius:999px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffa6d4,#ff6fb3);box-shadow:0 6px 0 var(--deep),0 12px 24px rgba(200,60,130,.25);padding:14px 30px;font-size:26px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(180,40,110,.3);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.btn.lav{background:linear-gradient(180deg,#cbb8ff,#9d82f5);box-shadow:0 6px 0 #7258d6,0 12px 24px rgba(110,80,200,.22)}
.btn.lav:active{box-shadow:0 2px 0 #7258d6}
.btn.mint{background:linear-gradient(180deg,#9ff0d4,#4fd1a8);box-shadow:0 6px 0 #2ea883,0 12px 24px rgba(40,160,120,.22);text-shadow:0 2px 0 rgba(20,120,90,.3)}
.btn.mint:active{box-shadow:0 2px 0 #2ea883}
.btn.white{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 6px 0 #f0bcd8,0 12px 24px rgba(200,60,130,.15)}
.btn.white:active{box-shadow:0 2px 0 #f0bcd8}
.btn.small{font-size:20px;padding:10px 20px}
.btn[hidden]{display:none}
.ibtn{background:rgba(255,255,255,.92);border-radius:20px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 0 #f0bcd8,0 8px 16px rgba(200,60,130,.12);flex:none}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #f0bcd8}
.ibtn.off{opacity:.45}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:8px 18px;font-weight:900;box-shadow:0 4px 0 rgba(200,90,150,.15);white-space:nowrap}
@keyframes pop{0%{scale:.3;opacity:0}100%{scale:1;opacity:1}}
@keyframes breath{50%{scale:1.06}}
@keyframes floaty{50%{translate:0 -10px}}
@keyframes wob{20%{rotate:-6deg}40%{rotate:5deg}60%{rotate:-3deg}80%{rotate:2deg}}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

/* ユニコ（ふきだし つき） */
.uni{display:flex;align-items:flex-end;gap:8px}
.uni .face{width:64px;height:58px;flex:none;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 30%,#fff,#fff4f7 60%,#ffe3ec);position:relative;animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(150,60,130,.2))}
.uni .face:before{content:"";position:absolute;left:17px;top:22px;width:8px;height:11px;border-radius:50%;background:#3a2a3a;box-shadow:22px 0 0 #3a2a3a}
.uni .face:after{content:"";position:absolute;left:8px;top:34px;width:12px;height:7px;border-radius:50%;background:#ff9fb8;box-shadow:36px 0 0 #ff9fb8}
.say{background:#fff;border-radius:24px;padding:10px 18px;font-size:22px;font-weight:900;box-shadow:0 5px 0 rgba(200,90,150,.12),0 10px 20px rgba(160,60,120,.12);position:relative;margin-bottom:22px;line-height:1.4;text-wrap:balance;white-space:pre-line;max-width:min(400px,calc(var(--vw) * 0.4))}
.say:after{content:"";position:absolute;left:-12px;bottom:14px;border:10px solid transparent;border-right-color:#fff;border-left:0}

/* タイトル */
#title{align-items:center;justify-content:space-around;text-align:center}
#title h1{margin:0;font-size:clamp(38px,calc(var(--vw) * 0.066),74px);line-height:1.15;color:#fff;letter-spacing:.04em;text-shadow:0 4px 0 #ff82bf,0 8px 0 #c77dff,0 14px 24px rgba(160,60,140,.3);-webkit-text-stroke:2px #ff9fd0}
#title .sub{font-weight:900;font-size:22px;color:#a04a86;margin-top:20px}
.tdeco{font-size:clamp(46px,calc(var(--vw) * 0.08),84px);display:flex;gap:18px;justify-content:center}
.tdeco span{animation:floaty 2.6s ease-in-out infinite}
.tdeco span:nth-child(2){animation-delay:.4s}.tdeco span:nth-child(3){animation-delay:.8s}
#startBtn{font-size:34px;padding:18px 56px;animation:breath 1.6s ease-in-out infinite}

/* ホーム */
.topbar{display:flex;align-items:center;gap:10px;height:var(--top);flex:none}
.topbar .grow{flex:1}
.logo{font-size:22px;font-weight:900;color:#c24d8f;background:rgba(255,255,255,.75);padding:8px 16px;border-radius:999px}
#home .body{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--vw) * 0.04);min-height:0}
.todayBox{background:rgba(255,255,255,.82);border-radius:36px;padding:22px 26px;box-shadow:0 8px 0 rgba(200,90,150,.15),0 18px 34px rgba(160,60,140,.15);display:flex;flex-direction:column;align-items:center;gap:16px}
.todayBox h2{margin:0;font-size:28px}
.cards3{display:flex;gap:16px}
.mini{width:110px;height:110px;border-radius:26px;background:linear-gradient(160deg,#fff,#ffeaf5);display:flex;align-items:center;justify-content:center;font-size:62px;box-shadow:inset 0 0 0 4px #ffd0e7;position:relative}
.mini.done:after{content:"✔";position:absolute;right:-8px;top:-8px;width:34px;height:34px;border-radius:50%;background:var(--mint);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.mini .q{font-size:56px;color:#e0a9cb}
.side{display:flex;flex-direction:column;gap:18px;align-items:center}
.count{font-size:20px;font-weight:900;text-align:center;background:rgba(255,255,255,.75);border-radius:22px;padding:10px 18px}
.count b{font-size:34px;color:var(--deep)}

/* レッスン */
.steps{display:flex;gap:8px;align-items:center}
.steps i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 3px #f5c2df}
.steps i.on{background:var(--pink);box-shadow:none}
.steps i.now{background:#fff;box-shadow:inset 0 0 0 5px var(--pink);scale:1.25}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(14px,calc(var(--vw) * 0.03),40px);min-height:0}
.board{width:var(--bs);height:var(--bs);flex:none;position:relative;border-radius:34px;background:#fff;box-shadow:0 8px 0 #f3c3dd,0 18px 36px rgba(160,60,140,.18);touch-action:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:calc(var(--vw) * 0.44);min-width:0}
.yomi{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.word{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.9);border-radius:24px;padding:8px 10px 8px 20px;box-shadow:0 5px 0 rgba(200,90,150,.12);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.word .w{font-size:54px;font-weight:900;line-height:1.1;white-space:nowrap}
.word .w em{font-style:normal;color:var(--deep)}
.word .r{font-size:22px;font-weight:900;color:#b0759c;white-space:nowrap}
.word .ibtn{width:50px;height:50px;font-size:24px;margin-left:auto}
.bigmsg{font-size:30px;font-weight:900;text-align:center;line-height:1.35}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* であう（えが かんじに かわる） */
.pic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;font-size:calc(var(--bs) * .5);line-height:1;transition:scale .7s cubic-bezier(.5,-0.4,.6,1),opacity .6s,filter .6s;pointer-events:none}
.pic.many{font-size:calc(var(--bs) * .3)}
.pic.stars{font-size:calc(var(--bs) * .15);gap:2% 4%;padding:12%}
.pic.num{font-size:calc(var(--bs) * .3);font-weight:900;color:#ff8cc6;text-shadow:0 6px 0 #ffd0e7}
.pic.gone{scale:.2;opacity:0;filter:blur(6px)}
.wand{position:absolute;right:-14px;bottom:-14px;width:96px;height:96px;border-radius:50%;font-size:52px;background:linear-gradient(160deg,#fff7d6,#ffd0ec);box-shadow:0 6px 0 #e6a6cc,0 10px 20px rgba(160,60,140,.25);animation:breath 1.2s ease-in-out infinite;z-index:3}
.wand:active{transform:translateY(3px)}
.flash{position:absolute;inset:0;border-radius:34px;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.0) 70%);opacity:0;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* ずかん */
#zukan .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 30px;touch-action:pan-y}
.grp{margin:10px 0 18px}
.grp h3{display:inline-block;margin:0 0 10px;padding:6px 16px;border-radius:999px;color:#fff;font-size:20px;text-shadow:0 1px 0 rgba(0,0,0,.12)}
.cells{display:flex;flex-wrap:wrap;gap:12px}
.cell{width:92px;height:104px;border-radius:22px;background:rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:rgba(122,53,99,.28);position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8)}
.cell.met{background:#fff;color:var(--ink);box-shadow:0 5px 0 #f3c3dd}
.cell .st{font-size:15px;height:18px;line-height:18px;letter-spacing:-1px}
.cell.s3{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#ff8fa3,#ffe066,#7fd0f5,#e79bff) border-box;border:4px solid transparent}
.credit{font-size:12px;color:#a2789a;text-align:center;margin-top:16px;line-height:1.6}
.credit a{color:inherit}

/* クイズ */
#quiz .stage{flex-direction:column;gap:18px}
.qhead{display:flex;align-items:center;gap:16px}
.qword{font-size:clamp(56px,calc(var(--vh) * 0.1),96px);font-weight:900;background:#fff;border-radius:30px;padding:6px 34px;box-shadow:0 8px 0 #f3c3dd;line-height:1.2;white-space:nowrap}
.qword em{font-style:normal;color:var(--deep)}
.qq{font-size:28px;font-weight:900}
.choices{display:flex;gap:clamp(12px,calc(var(--vw) * 0.024),28px)}
.choice{min-width:clamp(140px,calc(var(--vw) * 0.22),230px);min-height:clamp(96px,calc(var(--vh) * 0.22),170px);border-radius:30px;background:#fff;font-weight:900;font-size:clamp(30px,calc(var(--vh) * 0.05),44px);box-shadow:0 8px 0 #e4b6d6,0 14px 26px rgba(160,60,140,.15);padding:10px 18px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.choice.kanji{font-size:clamp(54px,calc(var(--vh) * 0.11),92px)}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 #e4b6d6}
.choice.no{animation:shake .45s;opacity:.45}
.choice.yes{background:linear-gradient(180deg,#fff,#d9fff0);box-shadow:0 8px 0 #63d3aa,0 0 0 6px #9ff0d4;animation:wob .6s}

/* おいわい */
#party{background:rgba(255,230,245,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);align-items:center;justify-content:center;z-index:20}
.pbox{background:#fff;border-radius:40px;padding:26px 40px;text-align:center;box-shadow:0 10px 0 #f3c3dd,0 24px 50px rgba(160,60,140,.25);animation:pop .5s cubic-bezier(.3,1.6,.5,1);max-width:calc(var(--vw) * 0.92)}
.pbox h2{margin:0 0 6px;font-size:40px;color:var(--deep)}
.pbox .stk{display:flex;gap:14px;justify-content:center;margin:14px 0 20px}
.sticker{width:96px;height:96px;border-radius:50%;background:linear-gradient(160deg,#fff,#ffe3f2);box-shadow:inset 0 0 0 5px #ffc2e2,0 6px 0 #f3c3dd;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.spark{position:absolute;font-size:28px;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(140deg)}}

/* iPhone よこ など ひくい画面 */

/* たて もち */
@media (max-aspect-ratio:1/1){
  .dressPanel{width:auto!important;right:14px!important;bottom:auto!important;height:56%!important}
  .stage{flex-direction:column}
  .panel{max-width:calc(var(--vw) * 0.94)}
  #home .body{flex-direction:column}
}

#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
.solid{background:inherit}
.solid:before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(circle at 78% 20%,rgba(255,255,255,.9) 0 2px,transparent 3px),
  radial-gradient(ellipse at 20% 0%,#ffd0ec 0%,transparent 55%),
  radial-gradient(ellipse at 100% 10%,#e3d2ff 0%,transparent 50%),
  linear-gradient(180deg,#ffc9e6 0%,#f1d3ff 38%,#d6ecff 72%,#d4fbef 100%)}
.hud{pointer-events:none}
.hud .pe,.hud button{pointer-events:auto}
.count2{font-size:20px}.count2 b{font-size:28px;color:var(--deep)}
.ibtn{position:relative}
.ibtn .dot{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#ff5a9e;border:3px solid #fff;animation:breath 1s infinite;display:none}
.ibtn .dot.on{display:block}
.hudBottom{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#todayBtn{font-size:30px;padding:16px 44px}
#todayBtn.pulse{animation:breath 1.5s ease-in-out infinite}
#bottomBtn{font-size:26px}
#zoomBtn{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}
.cap{background:rgba(255,255,255,.95);border-radius:28px;padding:10px 24px;font-weight:900;font-size:24px;text-align:center;box-shadow:0 6px 0 rgba(200,90,150,.15),0 12px 26px rgba(160,60,140,.15);animation:pop .4s cubic-bezier(.3,1.6,.5,1);display:flex;align-items:center;gap:14px;max-width:calc(var(--vw) * 0.92)}
.cap[hidden]{display:none}
.cap .ck{font-size:54px;line-height:1;color:var(--deep)}
.cap small{display:block;font-size:17px;color:#b0759c}
#title{background:linear-gradient(180deg,rgba(255,220,240,.35),rgba(255,255,255,0) 60%)}
/* きせかえ */
.dressPanel{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));bottom:max(12px,env(safe-area-inset-bottom));width:min(520px,calc(var(--vw) * 0.52));background:#fffaf4;border-radius:34px;box-shadow:0 8px 0 #f0d6c8,0 18px 36px rgba(120,60,90,.18);display:flex;flex-direction:column;align-items:center;padding:16px 18px;gap:12px}
.dressPanel h2{margin:0;font-size:36px;color:#6a3a58}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tab{border-radius:999px;padding:8px 20px;font-size:22px;font-weight:900;background:#f3e3ec;color:#7a5a6e;box-shadow:0 4px 0 #e2cbd8}
.tab.on{background:#ff6f91;color:#fff;box-shadow:0 4px 0 #d94b73}
.dgrid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;width:100%;padding:4px 4px 10px;align-content:start;touch-action:pan-y}
.ditem{border-radius:22px;background:#fff;box-shadow:0 5px 0 #ecd5e2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;min-height:104px;font-size:44px;position:relative}
.ditem small{font-size:14px;font-weight:900;color:#7a5a6e;margin-top:4px;text-align:center;line-height:1.2}
.ditem.sel{box-shadow:0 0 0 5px #ff6f91,0 5px 0 #ecd5e2}
.ditem.lock{background:#f7f1f4;color:#d8c6d0;box-shadow:none}
.ditem .new{position:absolute;top:-6px;right:-4px;background:#ff5a9e;color:#fff;font-size:12px;font-weight:900;border-radius:999px;padding:2px 7px}
/* モーダル */
#modal{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(255,230,245,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#modal.on{display:flex}
.mbox{overflow-y:auto;background:#fff;border-radius:36px;padding:20px 26px;box-shadow:0 10px 0 #f3c3dd,0 24px 50px rgba(160,60,140,.25);animation:pop .4s cubic-bezier(.3,1.6,.5,1);max-width:calc(var(--vw) * 0.94);max-height:calc(var(--vh) * 0.92);display:flex;flex-direction:column;align-items:center;gap:12px}
.mbox h2{margin:0;font-size:30px;color:var(--deep)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(40px,64px));gap:6px}
.cal div{aspect-ratio:1;background:#fff6fb;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#c9a0b8;position:relative}
.cal div.h{background:transparent;color:var(--ink);font-size:16px;aspect-ratio:auto;padding:2px}
.cal div.t{outline:4px solid #ff8fc6}
.cal div.x{background:transparent}
.cal b{position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3d6,#ff6fb3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,calc(var(--vh) * 0.036),30px);box-shadow:0 3px 0 #d94b93}
.cal b.land{animation:stampin .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{0%{scale:4;opacity:0;rotate:-30deg}100%{scale:1;opacity:1;rotate:0deg}}
.sgrid{display:grid;grid-template-columns:repeat(5,minmax(70px,96px));gap:12px;overflow-y:auto;max-height:calc(var(--vh) * 0.6);padding:4px;touch-action:pan-y}
.sgrid button{aspect-ratio:1;border-radius:22px;background:linear-gradient(160deg,#fff,#f3e8ff);box-shadow:0 5px 0 #d9c7f5;font-size:44px;font-weight:900;color:#6a3a9a}
.sgrid button.lock{background:#f6f2fa;color:#e0d6ec;box-shadow:none;font-size:30px}
.setrow{display:flex;gap:14px}
.toast{position:fixed;left:50%;top:22%;translate:-50% 0;z-index:40;background:#fff;border-radius:22px;padding:12px 22px;font-size:22px;font-weight:900;box-shadow:0 6px 0 #f3c3dd;animation:pop .3s}


/* iPad よこ（1024×768）を もとに、画面ぜんたいを 拡大・縮小する */
:root{--s:1;--vw:100vw;--vh:100vh}
.screen,#modal{inset:auto;left:0;top:0;width:var(--vw);height:var(--vh);transform:scale(var(--s));transform-origin:0 0}

/* しまの ラベルつき ボタン */
.lbtn{background:rgba(255,255,255,.94);border-radius:22px;width:84px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;box-shadow:0 5px 0 #f0bcd8,0 10px 18px rgba(200,60,130,.12);position:relative;line-height:1}
.lbtn small{font-size:14px;font-weight:900;margin-top:5px;color:var(--ink)}
.lbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #f0bcd8}
.lbtn .dot{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#ff5a9e;border:3px solid #fff;animation:breath 1s infinite;display:none}
.lbtn .dot.on{display:block}
.chip{font-size:22px;pointer-events:none}
.chip b{color:#ffb000;letter-spacing:2px;font-size:26px}
.chip.done{background:#e8fff4;color:#2e8a66}
.chip small{font-size:15px;display:block;text-align:center;color:#5fae8e}
.btn.sky{background:linear-gradient(180deg,#9fd8ff,#5fb2f5);box-shadow:0 6px 0 #3f8fd6,0 12px 24px rgba(60,140,220,.25);text-shadow:0 2px 0 rgba(30,100,180,.3)}
.btn.sky:active{box-shadow:0 2px 0 #3f8fd6}
/* すごろく */
.road{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.road .rl{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);flex:none}
.rk{display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.7);border-radius:18px;padding:4px 10px;min-width:70px;height:62px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.9);flex:none;transition:transform .2s}
.rk b{font-size:28px;line-height:1;color:#c9a0b8}
.rk span{font-size:15px;letter-spacing:1px;line-height:1;margin-top:3px}
.rk span i{font-style:normal;color:#e9d6e2}
.rk span i.on{color:#ffb000;text-shadow:0 1px 0 #d98a00}
.rk.now{background:#fff;box-shadow:0 0 0 4px var(--pink),0 6px 14px rgba(200,60,130,.25);transform:scale(1.12)}
.rk.now b{color:var(--deep)}
.rk.done{background:linear-gradient(160deg,#fff,#ffe1f0);box-shadow:inset 0 0 0 3px #ffc2e2}
.rk.done b{color:var(--deep)}
.rk.q b,.rk.g b{font-size:26px;color:inherit}
.rk.g{min-width:58px}
.rk.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.pill.mode{font-size:16px}
.flyer{position:fixed;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;line-height:1;filter:drop-shadow(0 4px 6px rgba(160,60,140,.3))}
.flyer.card{background:#fff;border-radius:24px;color:var(--deep);font-weight:900;box-shadow:0 0 0 5px #ffc2e2}
/* れんしゅう がめん */
.panel{height:var(--bs);justify-content:space-between}
.nextArea{min-height:84px;display:flex;align-items:flex-end;justify-content:center;width:100%}
.btn.go{font-size:32px;padding:18px 46px}
.boardIcon{position:absolute;left:-16px;top:-16px;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 5px 0 #f0bcd8,0 8px 16px rgba(200,60,130,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;color:var(--deep);z-index:4;line-height:1}
.boardIcon small{font-size:11px;font-weight:900;margin-top:2px}
.boardIcon[hidden]{display:none}
.boardIcon:active{transform:translateY(3px)}
.hana{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none;opacity:0;z-index:3}
.hana path{fill:none;stroke:#ff4f8f;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.hana .sp{stroke-width:3.2}.hana .pt{stroke-width:3}
.hana.on{opacity:.85}
.hana.on .sp{animation:draw .55s ease-out forwards}
.hana.on .pt{animation:draw .45s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dekita{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:calc(var(--bs) * .2);font-weight:900;color:#fff;-webkit-text-stroke:3px #ff6fb3;text-shadow:0 6px 0 #ff9fd0,0 10px 24px rgba(200,60,130,.4);white-space:nowrap;pointer-events:none;opacity:0;z-index:5}
.dekita.on{animation:dekita 1.6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes dekita{0%{opacity:0;scale:.2;rotate:-12deg}25%{opacity:1;scale:1.15;rotate:4deg}40%{scale:1;rotate:0}85%{opacity:1}100%{opacity:0;scale:1.05}}
/* おさらい（みずいろ） */
#lesson.review:before,#quiz.review:before{background:radial-gradient(circle at 15% 12%,rgba(255,255,255,.9) 0 2px,transparent 3px),linear-gradient(180deg,#cfe6ff 0%,#dcecff 45%,#dff9f2 100%)}
#lesson.review .rk.now{box-shadow:0 0 0 4px #5fb2f5,0 6px 14px rgba(60,140,220,.25)}
#lesson.review .board{box-shadow:0 8px 0 #bcdcf5,0 18px 36px rgba(60,120,200,.18)}
#qcount{font-size:18px}
/* おいわい */
#celebrate{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;overflow:hidden}
#celebrate.on{display:flex}
.crays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 7deg,rgba(255,220,240,.0) 7deg 18deg);animation:rays 2.6s linear,fadein .3s;border-radius:50%}
#celebrate.big .crays{background:repeating-conic-gradient(rgba(255,255,255,.6) 0 6deg,rgba(255,236,150,.25) 6deg 12deg,rgba(255,200,235,.0) 12deg 18deg)}
@keyframes rays{to{rotate:60deg}}
@keyframes fadein{from{opacity:0}}
.cconf{position:absolute;left:50%;top:50%}
.cconf i{position:absolute;width:14px;height:20px;border-radius:3px;animation:conf 1.8s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),calc(var(--y) + 30vh)) rotate(var(--r)) scale(1);opacity:0}}
.cbox{position:relative;text-align:center;animation:cbox .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes cbox{0%{scale:.1;rotate:-10deg;opacity:0}100%{scale:1;rotate:0;opacity:1}}
.cbox h2{margin:0;font-size:clamp(44px,8vmin,84px);line-height:1.15;color:#fff;-webkit-text-stroke:3px #ff6fb3;text-shadow:0 5px 0 #ff9fd0,0 10px 0 #c77dff,0 18px 30px rgba(160,60,140,.35);letter-spacing:.04em}
.cstars{font-size:clamp(40px,7vmin,70px);animation:spinin .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes spinin{0%{scale:0;rotate:-180deg}100%{scale:1;rotate:0}}
.cks{display:flex;gap:16px;justify-content:center;margin-top:16px}
.cks b{width:clamp(70px,12vmin,110px);height:clamp(70px,12vmin,110px);border-radius:26px;background:#fff;color:var(--deep);font-size:clamp(46px,8vmin,74px);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #ffd84a,0 8px 0 #f3c3dd;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.cgot{display:inline-block;margin-top:14px;background:#fff;border-radius:999px;padding:8px 20px;font-size:24px;font-weight:900;box-shadow:0 5px 0 #f3c3dd;animation:pop .5s .6s both}
</style>
</head>

  <div style="text-align:center">

<!-- よみクイズ -->
